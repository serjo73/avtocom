  const dz = makeDropZone('image/*', true, files => {
    const imgs = files.filter(f => /^image\/(jpeg|jpg|png)$/i.test(f.type) || /\.(jpe?g|png)$/i.test(f.name));
    if (!imgs.length){ toast('Нужны файлы JPG или PNG', 'error'); return; }
    convState.imgFiles = convState.imgFiles.concat(imgs);
    renderTools(area);
  });
  if (convState.imgFiles.length) dz.classList.add('has-file');
  card.appendChild(dz);

  const fl = document.createElement('div');
  fl.className = 'conv-filelist';
  renderFileList(fl, convState.imgFiles, i => {
    convState.imgFiles.splice(i, 1); renderTools(area);
  }, { preview: true });
  card.appendChild(fl);

  const opts = document.createElement('div');
  opts.className = 'conv-options';
  opts.innerHTML =
    '<div><label>Размер страницы</label><select id="cv-img-size">' +
      '<option value="auto"' + ((convState.imgSize||'auto')==='auto'?' selected':'') + '>По размеру картинки</option>' +
      '<option value="a4"' + ((convState.imgSize||'')==='a4'?' selected':'') + '>A4</option>' +
    '</select></div>' +
    '<div><label>Ориентация</label><select id="cv-img-orient">' +
      '<option value="auto"' + ((convState.imgOrient||'auto')==='auto'?' selected':'') + '>Авто</option>' +
      '<option value="portrait"' + ((convState.imgOrient||'')==='portrait'?' selected':'') + '>Портрет</option>' +
      '<option value="landscape"' + ((convState.imgOrient||'')==='landscape'?' selected':'') + '>Ландшафт</option>' +
    '</select></div>' +
    '<div class="full"><label>Имя файла результата</label><input type="text" id="cv-img-name" value="' + escapeHtml(convState.imgName||'result') + '" placeholder="result"></div>';
  card.appendChild(opts);

  const prog = document.createElement('div');
  prog.className = 'conv-progress';
  prog.innerHTML = '<span class="msg">Готово…</span><div class="bar"><div></div></div>';
  card.appendChild(prog);

  const actions = document.createElement('div');
  actions.className = 'conv-actions';
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  btn.textContent = '🚀 Собрать PDF';
  btn.disabled = convState.imgFiles.length === 0;
  btn.onclick = async () => {
    const pageSize = $('#cv-img-size', opts).value;
    const orientation = $('#cv-img-orient', opts).value;
    const name = ($('#cv-img-name', opts).value || 'result').trim();
    convState.imgSize = pageSize; convState.imgOrient = orientation; convState.imgName = name;
    prog.classList.add('show');
    const msgEl = prog.querySelector('.msg');
    const barEl = prog.querySelector('.bar > div');
    msgEl.textContent = 'Загружаю jsPDF…';
    barEl.style.width = '5%';
    try {
      const blob = await convertImagesToPdf(convState.imgFiles, { pageSize, orientation, quality: 0.92 },
        (i, total) => {
          msgEl.textContent = 'Обработка картинки ' + i + ' из ' + total + '…';
          barEl.style.width = Math.round((i / total) * 100) + '%';
        });
      prog.classList.remove('show');
      const outName = slug(name) + '.pdf';
      showConvResults(card, [{ blob, name: outName }]);
      toast('PDF собран: ' + outName, 'success');
    } catch(e){
      prog.classList.remove('show');
      toast('Ошибка: ' + e.message, 'error');
    }
  };
  actions.appendChild(btn);
  card.appendChild(actions);

  wrap.appendChild(card);
}

/* ============================================================
   ОБЩИЕ РЕЗУЛЬТАТЫ
   ============================================================ */
function showConvResults(card, results){
  card.querySelectorAll('.conv-results').forEach(el => el.remove());
  const box = document.createElement('div');
  box.className = 'conv-results';

  results.forEach(r => {
    const row = document.createElement('div');
    row.className = 'conv-result-item';

    /* Миниатюра-превью (для картинок и отрендеренных PDF-страниц) */
    const isImage = /^image\//.test(r.blob.type) || /\.(png|jpe?g|webp)$/i.test(r.name);
    if (isImage){
      const url = URL.createObjectURL(r.blob);
      const thumb = document.createElement('img');
      thumb.className = 'result-thumb';
      thumb.src = url;
      thumb.alt = '';
      thumb.title = 'Нажмите, чтобы увеличить';
      thumb.onclick = () => openImagePreview(url, r.name);
      row.appendChild(thumb);
    }

    /* Редактируемое имя */
    const nameWrap = document.createElement('div');
    nameWrap.className = 'result-name-wrap';
    const nameInp = document.createElement('input');
    nameInp.type = 'text';
    nameInp.className = 'result-name-input';
    nameInp.value = r.name;
    nameInp.title = 'Переименовать перед скачиванием';
    nameInp.spellcheck = false;
    nameInp.oninput = () => { r.name = nameInp.value; };
    const meta = document.createElement('span');
    meta.className = 'result-meta';
    meta.textContent = fmtBytes(r.blob.size);
    nameWrap.appendChild(nameInp);
    nameWrap.appendChild(meta);
    row.appendChild(nameWrap);

    /* Скачать */
    const dl = document.createElement('button');
    dl.className = 'dl';
    dl.textContent = '⬇ Скачать';
    dl.onclick = () => downloadBlob(r.blob, r.name || 'file');
    row.appendChild(dl);

    box.appendChild(row);
  });

  card.appendChild(box);
}

/* ============================================================
   ГЛАВНЫЙ РЕНДЕР КОНВЕРТЕРА
   ============================================================ */
function renderConverter(wrap, area){
  const subs = document.createElement('div'); subs.className = 'subtabs';
  [
    ['webp-img', '🖼 WebP → JPG/PNG'],
    ['pdf-img',  '📄 PDF → JPG'],
    ['img-pdf',  '🖼 JPG → PDF']
  ].forEach(([id, label]) => {
    const el = document.createElement('div');
    el.className = 'subtab' + (convMode === id ? ' active' : '');
    el.textContent = label;
    el.onclick = () => { convMode = id; renderTools(area); };
    subs.appendChild(el);
  });
  wrap.appendChild(subs);

  if (convMode === 'webp-img') renderWebpConverter(wrap, area);
  else if (convMode === 'pdf-img') renderPdfConverter(wrap, area);
  else renderImgConverter(wrap, area);
}


/* ============================================================
   СПРАВОЧНИК
   ============================================================ */
function createNewInstruction(){
  const instr = {
    id: uid(), name: 'Новая запись',
    content: '<p><br></p>',
    createdAt: Date.now(), updatedAt: Date.now(),
    tags: []
  };
  db.instructions.push(instr); saveDB();
  editingInstruction = instr;
  refReadMode = false;
  render();
}
function saveInstructionNow(){
  if (!editingInstruction) return;
  const instr = db.instructions.find(x=>x.id === editingInstruction.id);
  if (!instr) return;
  const editor = $('.instr-content');
  const titleInput = $('.instr-title-input');
  if (editor) instr.content = editor.innerHTML;
  if (titleInput) instr.name = titleInput.value.trim() || 'Без названия';
  instr.updatedAt = Date.now();
  editingInstruction = instr; saveDB();
}
let instrSaveTimer = null;
function saveInstructionDebounced(){
  clearTimeout(instrSaveTimer);
  instrSaveTimer = setTimeout(()=>{
    saveInstructionNow();
    const flag = $('.instr-meta .saved-flag');
    if (flag){ flag.textContent = '💾 Сохранено ' + new Date().toLocaleTimeString('ru-RU'); flag.classList.remove('dirty'); }
  },500);
}

/* ============================================================
   РАЗДЕЛ «МАРШРУТЫ» — СПИСОК
   ============================================================ */
function renderRoutesList(area){
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='list-wrap';
  const head = document.createElement('div'); head.className='list-head';
  head.innerHTML = `<h2>🗺 Маршруты <span class="count-badge">${db.routes.length}</span></h2>`;
  const headActions = document.createElement('div'); headActions.className='btn-row';
  const newBtn = document.createElement('button');
  newBtn.className='btn primary'; newBtn.textContent='➕ Новый маршрут';
  newBtn.onclick = ()=>{
    const r = defaultRoute('Новый маршрут');
    db.routes.push(r); saveDB();
    editingRoute = r; editingStepId = null; routesView='editor'; render();
  };
  headActions.appendChild(newBtn);
  head.appendChild(headActions);
  wrap.appendChild(head);

  if (!db.routes.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.innerHTML = '<span class="big-icon">🗺</span>Пока нет маршрутов.<br>Маршрут — это сценарий из нескольких инструкций с ветвлениями.<br>Например: «Замена масла КАМАЗ 5490» — общий шаг, потом ветка «Дизель / Бензин».';
    wrap.appendChild(e);
    area.appendChild(wrap);
    return;
  }

  /* Фильтры и теги */
  const allTags = collectTags(db.routes);
  if (allTags.length || db.routes.length){
    wrap.appendChild(renderFilterBar({
      allTags, activeTags: routesFilter.tags, sortValue: routesFilter.sort, search: routesFilter.search,
      placeholder: 'Поиск по названию маршрута, тегам…',
      onSearch: v=>{ routesFilter.search=v; renderRoutesList(area); },
      onSort: v=>{ routesFilter.sort=v; renderRoutesList(area); },
      onToggleTag: t=>{
        if (t===null) routesFilter.tags=[];
        else if (routesFilter.tags.includes(t)) routesFilter.tags = routesFilter.tags.filter(x=>x!==t);
        else routesFilter.tags = [...routesFilter.tags, t];
        renderRoutesList(area);
      }
    }));
  }

  const filtered = filterAndSort(db.routes, routesFilter);
  if (!filtered.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'Ничего не найдено по текущему фильтру.';
    wrap.appendChild(e);
    area.appendChild(wrap);
    return;
  }

  const grid = document.createElement('div'); grid.className='card-grid';
  filtered.forEach(r => {
    const card = document.createElement('div'); card.className='item-card';
    const stepCount = r.steps.length;
    const branchCount = r.steps.reduce((s, st) => s + (st.next.length > 1 ? 1 : 0), 0);
    card.innerHTML = `
      <span class="item-badge blue">маршрут</span>
      <div class="item-title">${escapeHtml(r.name)}</div>
      <div class="item-meta">
        ${stepCount} шаг${stepCount === 1 ? '' : stepCount < 5 ? 'а' : 'ов'}${branchCount ? ' · ' + branchCount + ' ветвлен.' : ''}<br>
        ${r.description ? escapeHtml(r.description) + '<br>' : ''}
        Изменён: ${fmtDate(r.updatedAt)}
      </div>
    `;
    const tagsEl = renderTagChips(r.tags); if (tagsEl) card.appendChild(tagsEl);

    const actions = document.createElement('div'); actions.className='item-actions';
    const open = document.createElement('button');
    open.className='card-btn primary'; open.textContent='✏️ Редактор';
    open.onclick = e => { e.stopPropagation(); editingRoute=r; editingStepId=r.startStepId||(r.steps[0]&&r.steps[0].id)||null; routesView='editor'; render(); };
    const run = document.createElement('button');
    run.className='card-btn'; run.textContent='▶️ Запустить';
    run.onclick = e => {
      e.stopPropagation();
      if (!r.startStepId){ toast('В маршруте не указан начальный шаг','error'); return; }
      if (!r.steps.length){ toast('В маршруте нет шагов','error'); return; }
      routeRunState = { routeId: r.id, currentStepId: r.startStepId, history: [r.startStepId] };
      routesView='runner'; render();
    };
    const map = document.createElement('button');
    map.className='card-btn'; map.textContent='🗺 Карта';
    map.onclick = e => { e.stopPropagation(); showRouteMap(r); };
    const tagsBtn = document.createElement('button');
    tagsBtn.className='card-btn'; tagsBtn.textContent='📑';
    tagsBtn.onclick = e => { e.stopPropagation(); editTagsFor(r, ()=>{ saveDB(); renderRoutesList(area); }); };
    const dup = document.createElement('button');
    dup.className='card-btn'; dup.textContent='＋';
    dup.title = 'Дублировать';
    dup.onclick = e => {
      e.stopPropagation();
      const c = normalizeRoute(clone(r));
      c.id = uid(); c.name = r.name+' (копия)';
      /* Перегенерируем ID шагов и перелинкуем next */
      const idMap = {};
      c.steps.forEach(s => { const old = s.id; s.id = uid(); idMap[old] = s.id; });
      c.steps.forEach(s => s.next.forEach(n => { if (idMap[n.targetStepId]) n.targetStepId = idMap[n.targetStepId]; }));
      c.startStepId = idMap[c.startStepId] || (c.steps[0] && c.steps[0].id);
      c.createdAt = Date.now(); c.updatedAt = Date.now();
      db.routes.push(c); saveDB(); renderRoutesList(area);
      toast('Маршрут продублирован','info');
    };
    const del = document.createElement('button');
    del.className='card-btn danger'; del.textContent='🗑';
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm(`Удалить маршрут «${r.name}»?\nИнструкции, на которые он ссылается, останутся.`)) return;
      db.routes = db.routes.filter(x=>x.id!==r.id);
      saveDB(); renderRoutesList(area);
      toast('Маршрут удалён','info');
    };
    actions.append(open, run, map, tagsBtn, dup, del);
    card.appendChild(actions);
    card.onclick = () => { editingRoute=r; editingStepId=r.startStepId||(r.steps[0]&&r.steps[0].id)||null; routesView='editor'; render(); };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  area.appendChild(wrap);
}

/* ============================================================
   РЕДАКТОР МАРШРУТА
   ============================================================ */
function renderRouteEditor(area, route){
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='list-wrap';
  const card = document.createElement('div'); card.className='conv-card';

  /* Шапка редактора: название + описание */
  const header = document.createElement('div');
  header.innerHTML = `<h3>✏️ Редактирование маршрута <span class="formula-tag">${escapeHtml(route.name)}</span></h3>`;
  card.appendChild(header);

  const metaGrid = document.createElement('div'); metaGrid.className='conv-options';
  const nameRow = document.createElement('div'); nameRow.className = 'full';
  const nameLbl = document.createElement('label'); nameLbl.textContent = 'Название маршрута';
  const nameInp = document.createElement('input');
  nameInp.type='text'; nameInp.value = route.name;
  nameInp.oninput = () => { route.name = nameInp.value; touch(route); };
  nameRow.appendChild(nameLbl); nameRow.appendChild(nameInp);
  metaGrid.appendChild(nameRow);

  const descRow = document.createElement('div'); descRow.className = 'full';
  const descLbl = document.createElement('label'); descLbl.textContent = 'Описание';
  const descInp = document.createElement('input');
  descInp.type='text'; descInp.value = route.description || '';
  descInp.placeholder = 'Например: Полный цикл замены масла для дизельных двигателей';
  descInp.oninput = () => { route.description = descInp.value; touch(route); };
  descRow.appendChild(descLbl); descRow.appendChild(descInp);
  metaGrid.appendChild(descRow);
  card.appendChild(metaGrid);

  /* Раскладка: слева — список шагов, справа — настройки текущего */
  const layout = document.createElement('div');
  layout.style.cssText = 'display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:16px;';

  /* === Левая колонка: список шагов === */
  const left = document.createElement('div');
  left.innerHTML = '<h4 style="margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);">Шаги маршрута</h4>';

  const stepsList = document.createElement('div');
  stepsList.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-bottom:14px;';

  route.steps.forEach((step, i) => {
    const row = document.createElement('div');
    const isStart = route.startStepId === step.id;
    const isSel = editingStepId === step.id;
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid ' + (isSel?'var(--primary)':'var(--border)') + ';background:' + (isSel?'var(--primary-soft)':'#fff') + ';';
    const num = document.createElement('span');
    num.style.cssText = 'font-weight:700;font-size:12px;color:' + (isSel?'var(--primary)':'var(--text-3)') + ';flex:0 0 auto;min-width:22px;';
    num.textContent = String(i+1);
    const txt = document.createElement('span');
    txt.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;';
    txt.textContent = step.title || '(без названия)';
    row.appendChild(num); row.appendChild(txt);
    if (isStart){
      const star = document.createElement('span');
      star.textContent = '▶'; star.title = 'Начальный шаг';
      star.style.cssText = 'color:var(--success);font-size:11px;font-weight:700;';
      row.appendChild(star);
    }
    row.onclick = () => { editingStepId = step.id; renderRouteEditor(area, route); };
    stepsList.appendChild(row);
  });
  left.appendChild(stepsList);

  const addStepBtn = document.createElement('button');
  addStepBtn.className = 'btn primary';
  addStepBtn.textContent = '➕ Добавить шаг';
  addStepBtn.style.width = '100%';
  addStepBtn.onclick = () => {
    const s = {
      id: uid(),
      title: 'Шаг ' + (route.steps.length + 1),
      type: 'instruction',
      instructionId: null,
      content: '',
      next: []
    };
    route.steps.push(s);
    if (!route.startStepId) route.startStepId = s.id;
    editingStepId = s.id;
    touch(route); renderRouteEditor(area, route);
  };
  left.appendChild(addStepBtn);

  /* === Правая колонка: настройки выбранного шага === */
  const right = document.createElement('div');
  right.innerHTML = '<h4 style="margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);">Настройки шага</h4>';

  const step = getRouteStep(route, editingStepId);
  if (!step){
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Выберите шаг слева или добавьте новый.';
    right.appendChild(hint);
  } else {
    /* Заголовок шага */
    const stepGrid = document.createElement('div'); stepGrid.className='conv-options';

    const titleRow = document.createElement('div'); titleRow.className='full';
    const tl = document.createElement('label'); tl.textContent = 'Название шага';
    const ti = document.createElement('input');
    ti.type='text'; ti.value = step.title || '';
    ti.oninput = () => { step.title = ti.value; touch(route); };
    titleRow.appendChild(tl); titleRow.appendChild(ti);
    stepGrid.appendChild(titleRow);

    /* Тип шага */
    const typeRow = document.createElement('div');
    const typeLbl = document.createElement('label'); typeLbl.textContent = 'Тип шага';
    const typeSel = document.createElement('select');
    [['instruction','Ссылка на инструкцию из справочника'], ['text','Просто текст']].forEach(([v,t])=>{
      const o = document.createElement('option'); o.value=v; o.textContent=t;
      if (step.type === v) o.selected = true;
      typeSel.appendChild(o);
    });
    typeSel.onchange = () => { step.type = typeSel.value; touch(route); renderRouteEditor(area, route); };
    typeRow.appendChild(typeLbl); typeRow.appendChild(typeSel);
    stepGrid.appendChild(typeRow);

    /* Если ссылка на инструкцию — выбор из справочника */
    if (step.type === 'instruction'){
      const insRow = document.createElement('div'); insRow.className = 'full';
      const il = document.createElement('label'); il.textContent = 'Инструкция из справочника';
      const iSel = document.createElement('select');
      const emptyOpt = document.createElement('option'); emptyOpt.value=''; emptyOpt.textContent='— не выбрано —';
      iSel.appendChild(emptyOpt);
      db.instructions.forEach(ins => {
        const o = document.createElement('option'); o.value = ins.id; o.textContent = ins.name || '(без названия)';
        if (step.instructionId === ins.id) o.selected = true;
        iSel.appendChild(o);
      });
      iSel.onchange = () => { step.instructionId = iSel.value || null; touch(route); };
      insRow.appendChild(il); insRow.appendChild(iSel);
      stepGrid.appendChild(insRow);
    } else {
      /* Если простой текст — textarea */
      const txtRow = document.createElement('div'); txtRow.className = 'full';
      const tl2 = document.createElement('label'); tl2.textContent = 'Текст шага';
      const ta = document.createElement('textarea');
      ta.value = step.content || '';
      ta.rows = 5;
      ta.oninput = () => { step.content = ta.value; touch(route); };
      txtRow.appendChild(tl2); txtRow.appendChild(ta);
      stepGrid.appendChild(txtRow);
    }

    right.appendChild(stepGrid);

    /* Начальный шаг */
    const startRow = document.createElement('label');
    startRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin:12px 0;cursor:pointer;padding:8px 12px;background:var(--panel-2);border-radius:7px;';
    const startChk = document.createElement('input');
    startChk.type = 'checkbox'; startChk.checked = route.startStepId === step.id;
    startChk.onchange = () => { route.startStepId = step.id; touch(route); renderRouteEditor(area, route); };
    startRow.appendChild(startChk);
    const startLbl = document.createElement('span');
    startLbl.style.fontSize = '13px';
    startLbl.textContent = '▶ Начальный шаг маршрута';
    startRow.appendChild(startLbl);
    right.appendChild(startRow);

    /* Переходы (next) */
    const nextHead = document.createElement('h4');
    nextHead.style.cssText = 'margin:18px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);';
    nextHead.textContent = 'Переходы → что дальше';
    right.appendChild(nextHead);

    const nextList = document.createElement('div');
    nextList.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    step.next.forEach((n, idx) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:center;padding:8px;background:var(--panel-2);border-radius:7px;';
      const labelInp = document.createElement('input');
      labelInp.type='text'; labelInp.value = n.label || '';
      labelInp.placeholder = 'Подпись (напр. «Дизель»)';
      labelInp.oninput = () => { n.label = labelInp.value; touch(route); };
      const targetSel = document.createElement('select');
      const emptyT = document.createElement('option'); emptyT.value=''; emptyT.textContent='— выберите шаг —';
      targetSel.appendChild(emptyT);
      route.steps.forEach(s => {
        if (s.id === step.id) return;   /* сам на себя нельзя */
        const o = document.createElement('option'); o.value = s.id; o.textContent = s.title || '(без названия)';
        if (n.targetStepId === s.id) o.selected = true;
        targetSel.appendChild(o);
      });
      targetSel.onchange = () => { n.targetStepId = targetSel.value || null; touch(route); };
      const delBtn = document.createElement('button');
      delBtn.className='card-btn danger'; delBtn.textContent='×'; delBtn.title='Удалить переход';
      delBtn.onclick = () => { step.next.splice(idx, 1); touch(route); renderRouteEditor(area, route); };
      row.appendChild(labelInp); row.appendChild(targetSel); row.appendChild(delBtn);
      nextList.appendChild(row);
    });
    right.appendChild(nextList);

    const addNextBtn = document.createElement('button');
    addNextBtn.className = 'btn';
    addNextBtn.style.marginTop = '10px';
    addNextBtn.textContent = '➕ Добавить переход';
    addNextBtn.onclick = () => {
      step.next.push({ id: uid(), label: step.next.length ? 'Вариант ' + (step.next.length+1) : 'Далее', targetStepId: null });
      touch(route); renderRouteEditor(area, route);
    };
    right.appendChild(addNextBtn);

    /* Удаление шага */
    const delStepWrap = document.createElement('div');
    delStepWrap.style.cssText = 'margin-top:22px;padding-top:18px;border-top:1px solid var(--border);';
    const delStepBtn = document.createElement('button');
    delStepBtn.className='btn danger';
    delStepBtn.textContent = '🗑 Удалить шаг';
    delStepBtn.onclick = () => {
      if (!confirm('Удалить этот шаг из маршрута?')) return;
      /* Убираем сам шаг и все ссылки на него */
      route.steps = route.steps.filter(s => s.id !== step.id);
      route.steps.forEach(s => { s.next = s.next.filter(n => n.targetStepId !== step.id); });
      if (route.startStepId === step.id) route.startStepId = route.steps[0] ? route.steps[0].id : null;
      editingStepId = route.steps[0] ? route.steps[0].id : null;
      touch(route); renderRouteEditor(area, route);
    };
    delStepWrap.appendChild(delStepBtn);
    right.appendChild(delStepWrap);
  }

  layout.appendChild(left);
  layout.appendChild(right);
  card.appendChild(layout);

  wrap.appendChild(card);
  area.appendChild(wrap);
}

/* ============================================================
   ПРОХОЖДЕНИЕ МАРШРУТА (RUNNER) — v2
   ============================================================ */
function renderRouteRunner(area, runState){
  area.innerHTML = '';
  const route = db.routes.find(r => r.id === runState.routeId);
  if (!route){
    area.innerHTML = '<div class="empty-state">Маршрут не найден</div>';
    return;
  }
  const step = getRouteStep(route, runState.currentStepId);
  if (!step){
    area.innerHTML = '<div class="empty-state">Шаг не найден</div>';
    return;
  }

  const total = route.steps.length;
  const pos = runState.history.length;
  const nextList = step.next.filter(n => n.targetStepId);
  const singleNext = nextList.length === 1 ? nextList[0] : null;
  const canBack = runState.history.length > 1;

  const wrap = document.createElement('div');
  wrap.className = 'route-runner';

  /* ============================================================
     STICKY-ХЕДЕР
     ============================================================ */
  const sticky = document.createElement('div');
  sticky.className = 'route-sticky';

  const title = document.createElement('div');
  title.className = 'route-sticky-title';
  title.innerHTML = '🗺 ' + escapeHtml(route.name) +
    '<span class="badge">Шаг ' + pos + ' из ' + total + '</span>';
  sticky.appendChild(title);

  const nav = document.createElement('div');
  nav.className = 'route-sticky-nav';

  /* Назад */
  const btnBack = document.createElement('button');
  btnBack.className = 'route-nav-btn' + (canBack ? '' : ' disabled');
  btnBack.title = 'Назад (←)';
  btnBack.innerHTML = '<span class="arr">‹</span><span class="lbl">Назад</span>';
  if (canBack){
    btnBack.onclick = () => {
      runState.history.pop();
      runState.currentStepId = runState.history[runState.history.length - 1];
      render();
    };
  }
  nav.appendChild(btnBack);

  /* Далее — только если одиночный переход */
  if (singleNext){
    const btnNext = document.createElement('button');
    btnNext.className = 'route-nav-btn primary';
    btnNext.title = 'Далее (→)';
    btnNext.innerHTML = '<span class="lbl">Далее</span><span class="arr">›</span>';
    btnNext.onclick = () => {
      runState.currentStepId = singleNext.targetStepId;
      runState.history.push(singleNext.targetStepId);
      render();
    };
    nav.appendChild(btnNext);
  } else if (nextList.length > 1){
    const btnNext = document.createElement('button');
    btnNext.className = 'route-nav-btn disabled';
    btnNext.title = 'Есть несколько вариантов — выберите ниже';
    btnNext.innerHTML = '<span class="lbl">Выбор ↓</span>';
    nav.appendChild(btnNext);
  }

  /* Домой */
  const btnHome = document.createElement('button');
  btnHome.className = 'route-nav-btn';
  btnHome.title = 'Выйти к списку маршрутов (Esc)';
  btnHome.innerHTML = '🏠 <span class="lbl">К списку</span>';
  btnHome.onclick = () => { routesView = 'list'; routeRunState = null; render(); };
  nav.appendChild(btnHome);

  sticky.appendChild(nav);
  wrap.appendChild(sticky);

  /* ============================================================
     LAYOUT: список шагов слева, контент справа
     ============================================================ */
  const layout = document.createElement('div');
  layout.className = 'route-layout';

  /* === Левая колонка: список всех шагов === */
  const stepsPanel = document.createElement('div');
  stepsPanel.className = 'route-steps';

  const stepsHead = document.createElement('div');
  stepsHead.className = 'route-steps-head';
  stepsHead.textContent = 'Шаги маршрута (' + total + ')';
  stepsPanel.appendChild(stepsHead);

  const histSet = new Set(runState.history);

  route.steps.forEach((s, i) => {
    const item = document.createElement('div');
    const isCurrent = s.id === runState.currentStepId;
    const isPassed = histSet.has(s.id);
    const hasBranch = s.next.length > 1;

    item.className = 'route-step-item' +
      (isCurrent ? ' current' : '') +
      (isPassed ? ' passed' : '');

    const num = document.createElement('span');
    num.className = 'route-step-num';
    num.textContent = isPassed && !isCurrent ? '✓' : String(i + 1);

    const ttl = document.createElement('span');
    ttl.className = 'route-step-title';
    ttl.textContent = s.title || ('Шаг ' + (i + 1));

    item.appendChild(num);
    item.appendChild(ttl);

    if (hasBranch){
      const tag = document.createElement('span');
      tag.className = 'route-step-branch-tag';
      tag.textContent = 'ветвл.';
      item.appendChild(tag);
    }

    item.title = s.title || '';
    item.onclick = () => {
      if (s.id === runState.currentStepId) return;
      const idx = runState.history.indexOf(s.id);
      if (idx >= 0){
        /* Уже были на этом шаге — обрезаем историю до него */
        runState.history = runState.history.slice(0, idx + 1);
      } else {
        /* Переход по клику сбоку — добавляем как новый шаг */
        runState.history.push(s.id);
      }
      runState.currentStepId = s.id;
      render();
    };
    stepsPanel.appendChild(item);
  });

  layout.appendChild(stepsPanel);

  /* === Правая колонка: контент шага === */
  const card = document.createElement('div');
  card.className = 'route-content-card';

  const stepIdx = route.steps.indexOf(step) + 1;
  const h1 = document.createElement('h2');
  h1.className = 'route-step-title-h1';
  h1.textContent = step.title || ('Шаг ' + stepIdx);
  card.appendChild(h1);

  const subtitle = document.createElement('div');
  subtitle.className = 'route-step-subtitle';
  if (step.type === 'instruction'){
    const ins = db.instructions.find(i => i.id === step.instructionId);
    subtitle.textContent = ins ? ('📖 Инструкция: ' + ins.name) : '📖 Инструкция не выбрана';
  } else {
    subtitle.textContent = '📝 Текстовый шаг';
  }
  card.appendChild(subtitle);

  const content = document.createElement('div');
  content.className = 'route-content-body';

  if (step.type === 'instruction'){
    const ins = db.instructions.find(i => i.id === step.instructionId);
    if (ins){
      content.innerHTML = ins.content || '<p><em>(инструкция пуста)</em></p>';
    } else {
      content.innerHTML = '<div class="route-empty-step">Инструкция не выбрана или была удалена. Перейдите в редактор маршрута, чтобы исправить.</div>';
    }
  } else {
    if (step.content && step.content.trim()){
      content.innerHTML = step.content.replace(/\n/g, '<br>');
    } else {
      content.innerHTML = '<div class="route-empty-step">Пустой шаг — добавьте текст в редакторе маршрута.</div>';
    }
  }

  /* Клик по картинке — превью с зумом */
  content.addEventListener('click', e => {
    if (e.target.tagName === 'IMG'){
      e.preventDefault();
      const src = e.target.src;
      const alt = e.target.alt || 'Изображение';
      if (typeof openImagePreview === 'function') openImagePreview(src, alt);
      else window.open(src, '_blank');
    }
  });
  content.querySelectorAll('img').forEach(img => { img.style.cursor = 'zoom-in'; });

  card.appendChild(content);

  /* === Блок переходов === */
  if (nextList.length === 0){
    const fin = document.createElement('div');
    fin.className = 'route-finish-box';
    fin.innerHTML =
      '<span class="big">✅</span>' +
      '<div class="ttl">Маршрут завершён</div>' +
      '<div class="sub">Это последний шаг. Можно вернуться к списку или пройти маршрут заново.</div>';
    const btns = document.createElement('div');
    btns.className = 'btns';
    const btnRestart = document.createElement('button');
    btnRestart.className = 'route-nav-btn';
    btnRestart.textContent = '🔄 Пройти заново';
    btnRestart.onclick = () => {
      runState.currentStepId = route.startStepId;
      runState.history = [route.startStepId];
      render();
    };
    const btnHome2 = document.createElement('button');
    btnHome2.className = 'route-nav-btn primary';
    btnHome2.textContent = '🏠 К списку маршрутов';
    btnHome2.onclick = () => { routesView = 'list'; routeRunState = null; render(); };
    btns.append(btnRestart, btnHome2);
    fin.appendChild(btns);
    card.appendChild(fin);

  } else if (singleNext){
    const head = document.createElement('div');
    head.className = 'route-next-head';
    head.textContent = 'Далее';
    card.appendChild(head);

    const nextStep = getRouteStep(route, singleNext.targetStepId);
    const btn = document.createElement('button');
    btn.className = 'route-next-btn';
    btn.innerHTML =
      '<span class="arrow">→</span>' +
      '<span class="btn-label">' + escapeHtml(singleNext.label || 'Продолжить') + '</span>' +
      '<span class="btn-target">' + (nextStep ? escapeHtml(nextStep.title || '') : '') + '</span>';
    btn.onclick = () => {
      runState.currentStepId = singleNext.targetStepId;
      runState.history.push(singleNext.targetStepId);
      render();
    };
    card.appendChild(btn);

  } else {
    const head = document.createElement('div');
    head.className = 'route-next-head';
    head.textContent = 'Выберите вариант продолжения';
    card.appendChild(head);

    const box = document.createElement('div');
    box.className = 'route-next-buttons';
    nextList.forEach(n => {
      const nextStep = getRouteStep(route, n.targetStepId);
      const btn = document.createElement('button');
      btn.className = 'route-next-btn';
      btn.innerHTML =
        '<span class="arrow">→</span>' +
        '<span class="btn-label">' + escapeHtml(n.label || 'Далее') + '</span>' +
        '<span class="btn-target">' + (nextStep ? escapeHtml(nextStep.title || '') : '') + '</span>';
      btn.onclick = () => {
        runState.currentStepId = n.targetStepId;
        runState.history.push(n.targetStepId);
        render();
      };
      box.appendChild(btn);
    });
    card.appendChild(box);
  }

  layout.appendChild(card);
  wrap.appendChild(layout);
  area.appendChild(wrap);

  try { area.scrollTop = 0; } catch(_){}
}

/* ============================================================
   SVG-КАРТА МАРШРУТА (предпросмотр)
   ============================================================ */
function showRouteMap(route){
  if (!route) return;
  if (!route.steps.length){ toast('В маршруте нет шагов','error'); return; }

  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.style.alignItems = 'flex-start';
  ov.style.overflowY = 'auto';

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = '1000px';
  modal.innerHTML = '<h3>🗺 Карта маршрута: ' + escapeHtml(route.name) + '</h3>';

  const svg = buildRouteMapSVG(route);
  const wrapSvg = document.createElement('div');
  wrapSvg.style.cssText = 'overflow:auto;padding:10px;background:var(--panel-2);border-radius:10px;';
  wrapSvg.appendChild(svg);
  modal.appendChild(wrapSvg);

  const actions = document.createElement('div'); actions.className='modal-actions';
  const closeBtn = document.createElement('button'); closeBtn.textContent='Закрыть';
  closeBtn.onclick = ()=>ov.remove();
  actions.appendChild(closeBtn);
  modal.appendChild(actions);

  ov.appendChild(modal);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

function buildRouteMapSVG(route){
  /* Простой слоистый layout: шаг, у которого нет входящих ссылок — верх;
     дальше — следующие, и так по «глубине». */
  const incoming = {};
  route.steps.forEach(s => { incoming[s.id] = 0; });
  route.steps.forEach(s => s.next.forEach(n => {
    if (incoming[n.targetStepId] !== undefined) incoming[n.targetStepId]++;
  }));

  /* Считаем "уровень" каждого шага — максимум по входящим путям */
  const level = {};
  const visited = new Set();
  function walk(id, lv){
    if (visited.has(id)) { if ((level[id]||0) < lv) level[id] = lv; return; }
    visited.add(id);
    level[id] = Math.max(level[id] || 0, lv);
    const s = getRouteStep(route, id);
    if (!s) return;
    s.next.forEach(n => { if (n.targetStepId) walk(n.targetStepId, lv + 1); });
  }
  route.steps.forEach(s => {
    if (incoming[s.id] === 0 || s.id === route.startStepId) walk(s.id, 0);
  });
  /* Осиротевшие шаги — на уровне 0 */
  route.steps.forEach(s => { if (level[s.id] === undefined) level[s.id] = 0; });

  /* Группируем по уровням */
  const byLevel = {};
  route.steps.forEach(s => {
    const lv = level[s.id] || 0;
    (byLevel[lv] = byLevel[lv] || []).push(s);
  });
  const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);

  /* Размеры */
  const NW = 220, NH = 56;         /* размер узла */
  const GAP_X = 30, GAP_Y = 70;    /* отступы */
  const PAD = 20;
  let maxCols = 0;
  levels.forEach(lv => { maxCols = Math.max(maxCols, byLevel[lv].length); });
  const W = PAD*2 + maxCols*(NW+GAP_X);
  const H = PAD*2 + levels.length*(NH+GAP_Y);

  /* Позиции узлов */
  const pos = {};
  levels.forEach((lv, li) => {
    const row = byLevel[lv];
    const totalW = row.length*NW + (row.length-1)*GAP_X;
    const startX = (W - totalW)/2;
    row.forEach((s, i) => {
      pos[s.id] = {
        x: startX + i*(NW+GAP_X),
        y: PAD + li*(NH+GAP_Y)
      };
    });
  });

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.background = '#fff';
  svg.style.borderRadius = '8px';
  svg.style.display = 'block';

  /* Стрелки-маркеры */
  const defs = document.createElementNS(svgNS, 'defs');
  const marker = document.createElementNS(svgNS, 'marker');
  marker.setAttribute('id', 'arr');
  marker.setAttribute('viewBox', '0 0 10 10');
  marker.setAttribute('refX', '9'); marker.setAttribute('refY', '5');
  marker.setAttribute('markerWidth', '6'); marker.setAttribute('markerHeight', '6');
  marker.setAttribute('orient', 'auto-start-reverse');
  const arrow = document.createElementNS(svgNS, 'path');
  arrow.setAttribute('d', 'M0 0 L10 5 L0 10 z');
  arrow.setAttribute('fill', '#94a3b8');
  marker.appendChild(arrow);
  defs.appendChild(marker);
  svg.appendChild(defs);

  /* Рёбра */
  route.steps.forEach(s => {
    const from = pos[s.id]; if (!from) return;
    s.next.forEach(n => {
      const to = pos[n.targetStepId]; if (!to) return;
      const x1 = from.x + NW/2, y1 = from.y + NH;
      const x2 = to.x + NW/2, y2 = to.y;
      const path = document.createElementNS(svgNS, 'path');
      const midY = (y1 + y2) / 2;
      const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
      path.setAttribute('d', d);
      path.setAttribute('stroke', '#94a3b8');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', 'url(#arr)');
      svg.appendChild(path);
      /* Подпись */
      if (n.label){
        const lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('x', (x1+x2)/2 + 6);
        lbl.setAttribute('y', midY + 4);
        lbl.setAttribute('font-size', '11');
        lbl.setAttribute('fill', '#475569');
        lbl.textContent = n.label;
        svg.appendChild(lbl);
      }
    });
  });

  /* Узлы */
  route.steps.forEach(s => {
    const p = pos[s.id]; if (!p) return;
    const isStart = route.startStepId === s.id;
    const g = document.createElementNS(svgNS, 'g');
    g.style.cursor = 'pointer';
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', NW); rect.setAttribute('height', NH);
    rect.setAttribute('rx', '8');
    rect.setAttribute('fill', isStart ? '#dbeafe' : '#fff');
    rect.setAttribute('stroke', isStart ? '#2563eb' : '#cbd5e1');
    rect.setAttribute('stroke-width', isStart ? '2' : '1');
    g.appendChild(rect);
    /* Название */
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', p.x + NW/2);
    t.setAttribute('y', p.y + NH/2 - 4);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '12');
    t.setAttribute('font-weight', '600');
    t.setAttribute('fill', '#0f172a');
    let title = s.title || '(без названия)';
    if (title.length > 30) title = title.slice(0, 28) + '…';
    t.textContent = title;
    g.appendChild(t);
    /* Подпись типа */
    const sub = document.createElementNS(svgNS, 'text');
    sub.setAttribute('x', p.x + NW/2);
    sub.setAttribute('y', p.y + NH/2 + 12);
    sub.setAttribute('text-anchor', 'middle');
    sub.setAttribute('font-size', '10');
    sub.setAttribute('fill', '#94a3b8');
    if (s.type === 'instruction'){
      const ins = db.instructions.find(i => i.id === s.instructionId);
      sub.textContent = ins ? '📖 ' + ins.name : '📖 (инструкция не выбрана)';
      if (sub.textContent.length > 32) sub.textContent = sub.textContent.slice(0, 30) + '…';
    } else {
      sub.textContent = '📝 текст';
    }
    g.appendChild(sub);
    svg.appendChild(g);
  });

  return svg;
}

function renderReferenceList(area){
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='instr-wrap';
  const head = document.createElement('div'); head.className='list-head';
  head.innerHTML = `<h2>📖 Справочник <span class="count-badge">${db.instructions.length}</span></h2>`;
  const headActions = document.createElement('div'); headActions.className='btn-row';
  const newBtn = document.createElement('button');
  newBtn.className='btn primary'; newBtn.textContent='➕ Новая запись';
  newBtn.onclick = createNewInstruction;
  headActions.appendChild(newBtn);
  head.appendChild(headActions);
  wrap.appendChild(head);

  if (db.instructions.length){
    const allTags = collectTags(db.instructions);
    wrap.appendChild(renderFilterBar({
      allTags, activeTags: refFilter.tags, sortValue: refFilter.sort, search: refFilter.search,
      onSearch: v=>{ refFilter.search=v; renderReferenceList(area); },
      onSort: v=>{ refFilter.sort=v; renderReferenceList(area); },
      onToggleTag: t=>{
        if (t===null) refFilter.tags = [];
        else if (refFilter.tags.includes(t)) refFilter.tags = refFilter.tags.filter(x=>x!==t);
        else refFilter.tags = [...refFilter.tags, t];
        renderReferenceList(area);
      }
    }));
  }
  const filtered = filterAndSort(db.instructions, refFilter);
  if (!db.instructions.length){
    const empty = document.createElement('div'); empty.className='empty-state';
    empty.innerHTML = '<span class="big-icon">📖</span>Пока нет ни одной записи.<br>Нажмите «➕ Новая запись».';
    wrap.appendChild(empty); area.appendChild(wrap); return;
  }
  if (!filtered.length){
    const empty = document.createElement('div'); empty.className='empty-state';
    empty.textContent = 'Ничего не найдено по текущему фильтру.';
    wrap.appendChild(empty); area.appendChild(wrap); return;
  }
  const grid = document.createElement('div'); grid.className='card-grid';
  filtered.forEach(instr=>{
    const card = document.createElement('div'); card.className='item-card';
    const preview = (instr.content||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,130);
    card.innerHTML = `
      <span class="item-badge">справочник</span>
      <div class="item-title">${escapeHtml(instr.name)}</div>
      <div class="item-meta">Обновлено: ${fmtDate(instr.updatedAt)}<br>${escapeHtml(preview)}${preview.length>=130?'…':''}</div>`;
    const tagsEl = renderTagChips(instr.tags); if (tagsEl) card.appendChild(tagsEl);
    const actions = document.createElement('div'); actions.className='item-actions';
    const open = document.createElement('button');
    open.className='card-btn primary'; open.textContent='👁 Открыть';
    open.onclick = e=>{ e.stopPropagation(); editingInstruction = instr; refReadMode = true; render(); };
    const tagsBtn = document.createElement('button');
    tagsBtn.className='card-btn'; tagsBtn.textContent='📑';
    tagsBtn.onclick = e=>{ e.stopPropagation(); editTagsFor(instr, ()=>{ saveDB(); renderReferenceList(area); }); };
    const dup = document.createElement('button');
    dup.className='card-btn'; dup.textContent='＋';
    dup.onclick = e=>{ e.stopPropagation();
      const c = clone(instr); c.id = uid(); c.name = instr.name+' (копия)';
      c.createdAt = Date.now(); c.updatedAt = Date.now();
      db.instructions.push(c); saveDB(); renderReferenceList(area);
      toast('Запись продублирована','info');

  let savedRange = null;
  function saveRange(){
    const sel = window.getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
  }
  function restoreRange(){
    if (!savedRange) return;
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange);
  }
  editor.addEventListener('mouseup', ()=>{ saveRange(); updateToolbarState(); });
  editor.addEventListener('keyup', ()=>{ saveRange(); updateToolbarState(); });
  editor.addEventListener('input', ()=>{ saveRange(); saveInstructionDebounced(); markDirty(); });
  editor.addEventListener('blur', saveRange);

  function exec(cmd,val){
    editor.focus(); restoreRange();
    try{ document.execCommand(cmd,false,val||null); }catch(e){}
    saveRange(); saveInstructionDebounced(); markDirty(); updateToolbarState();
    makeImagesResizable(editor, ()=>{ saveInstructionDebounced(); markDirty(); });
  }

    b.addEventListener('click',()=>exec(cmd,val));

    let html = '<table>';
    for (let r=0;r<rows;r++){ html+='<tr>'; for (let c=0;c<cols;c++) html+='<td>&nbsp;</td>'; html+='</tr>'; }
    html += '</table><p><br></p>';
    editor.focus(); restoreRange();
    document.execCommand('insertHTML', false, html);
    saveInstructionDebounced(); markDirty();
  });
  tb.appendChild(tblBtn);
  if (!readMode) ed.appendChild(tb);
  
  
  const titleInput = document.createElement('input');

  const tagsLine = document.createElement('div');

    const editBtn = document.createElement('button');
    editBtn.className='card-btn'; editBtn.textContent='📑 Изменить теги';
    editBtn.style.fontSize = '11.5px';

    tagsLine.appendChild(editBtn);
  };
  renderTagsLine(); ed.appendChild(tagsLine);

  editor.innerHTML = instr.content || '<p><br></p>';
  ed.appendChild(editor);

  const meta = document.createElement('div'); meta.className='instr-meta';
  if (readMode){
    meta.innerHTML = '<span style="color:var(--primary);font-weight:600;">👁 Режим чтения — редактирование отключено</span><span>Обновлено: ' + fmtDate(instr.updatedAt) + '</span>';
  } else {
    meta.innerHTML = '<span class="saved-flag">💾 Сохранено</span><span>Обновлено: ' + fmtDate(instr.updatedAt) + '</span>';
  }
  ed.appendChild(meta);

  wrap.appendChild(ed); area.appendChild(wrap);
  if (!readMode){
    makeImagesResizable(editor, ()=>{ saveInstructionDebounced(); markDirty(); });
  }

  function markDirty(){
    const flag = meta.querySelector('.saved-flag');
    flag.textContent = '✏️ Есть несохранённые изменения';
    flag.classList.add('dirty');
  }
  function updateToolbarState(){
    tb.querySelectorAll('button.ib').forEach(b=>{
      const cmd = b.dataset.cmd; if (!cmd) return;
      let active = false;
      try{ active = document.queryCommandState(cmd); }catch(e){}
      b.classList.toggle('active', active);
    });
  }
  if (readMode){
    /* В режиме чтения клик по картинке → превью с зумом */
    editor.addEventListener('click', e => {
      if (e.target.tagName === 'IMG'){
        e.preventDefault();
        e.stopPropagation();
        const src = e.target.src;
        const alt = e.target.alt || 'Изображение';
        if (typeof openImagePreview === 'function') openImagePreview(src, alt);
        else window.open(src, '_blank');
      }
    });
    editor.querySelectorAll('img').forEach(img => { img.style.cursor = 'zoom-in'; });
  } else {
    editor.addEventListener('click',e=>{ if (e.target.tagName==='IMG') selectImg(e.target); else clearImgSelection(); });
    editor.addEventListener('keydown',e=>{
      if (e.key==='Backspace'||e.key==='Delete'){
        if (removeSelectedImage()){ e.preventDefault(); saveInstructionDebounced(); markDirty(); }
      }
    });
  }
}

function section(title,build){
  const s = document.createElement('div'); s.className='sec';
  const h = document.createElement('h3'); h.textContent = title; s.appendChild(h);
  const body = document.createElement('div'); const content = build(); if (content) body.appendChild(content);
  s.appendChild(body); return s;
}
function labeled(text,el,stacked){
  const l = document.createElement('label');
  l.className = 'field' + (stacked?' col-field':'');
  const s = document.createElement('span'); s.textContent = text;
  l.appendChild(s); l.appendChild(el); return l;
}
function numInput(val,min,max,onInput,step,id){
  const i = document.createElement('input');
  i.type='number'; i.value=val; i.min=min; i.max=max; if (id) i.id=id; if (step) i.step=step;
  i.addEventListener('input',()=>{ let v=parseFloat(i.value); if (isNaN(v)) return; v=Math.min(max,Math.max(min,v)); onInput(v); });
  return i;
}
function dimInput(pxValue,minPx,maxPx,onPxChange){
  const i = document.createElement('input'); i.type='number';
  const minDisp = roundUnitFromPx(minPx), maxDisp = roundUnitFromPx(maxPx);
  i.min = String(minDisp); i.max = String(maxDisp);
  i.step = unit==='px'?'1':(unit==='cm'?'0.01':'0.1');
  i.value = String(roundUnitFromPx(pxValue));
  i.title = `от ${minDisp} до ${maxDisp} ${unitSymbol()}`;
  i.addEventListener('input',()=>{
    let v = parseFloat(i.value.replace(',','.')); if (isNaN(v)) return;
    const px = unitToPx(v);
    const clamped = Math.max(minPx, Math.min(maxPx, Math.round(px)));
    onPxChange(clamped);
  });
  return i;
}

function saveDraftAsTemplate(){
  const name = prompt('Название шаблона:', draft.name||'Новый документ');
  if (name === null) return;
  const t = clone(draft);
  t.id = uid(); t.name = (name.trim()||'Без названия');
  t.createdAt = Date.now(); t.updatedAt = Date.now();
  pruneCells(t); normalizeTemplate(t);
  db.templates.push(t); saveDB();
  activeTemplateId = t.id; mode='fill'; selection=null;
  draft = defaultTemplate('Новый документ'); saveDraft();
  render();
  toast('Шаблон «'+t.name+'» сохранён','success');
}
function clearDraft(){
  if (!confirm('Очистить текущий лист?')) return;
  draft = defaultTemplate('Новый документ');
  selection = null; saveDraft(); render();
  toast('Лист очищен','info');
}
function renameTemplate(tpl){
  if (!tpl) return;
  const name = prompt('Новое название:', tpl.name); if (name === null) return;
  tpl.name = name.trim() || tpl.name;
  tpl.updatedAt = Date.now(); saveDB(); render();
  toast('Переименовано','success');
}
function duplicateTemplate(tpl){
  if (!tpl) return;
  const c = normalizeTemplate(clone(tpl));
  c.id = uid(); c.name = tpl.name+' (копия)';
  c.createdAt = Date.now(); c.updatedAt = Date.now();
  db.templates.push(c); saveDB(); render();
  toast('Шаблон продублирован','success');
}
function saveDocumentCopy(tpl){
  if (!tpl) return;
  const defName = `${tpl.name} — ${new Date().toLocaleString('ru-RU')}`;
  const name = prompt('Название копии:', defName); if (name === null) return;

  const org = db.organizations.find(o => o.id === tpl.currentOrgId);
  const resolvedCells = clone(tpl.cells);
  for (const k in resolvedCells){
    const cell = resolvedCells[k];
    if (cell.type === 'org-select'){
      cell.html = org ? escapeHtml(org.name) : '';
    } else if (cell.type === 'org-field'){
      const val = org ? (org[cell.orgField] || '') : '';
      cell.html = escapeHtml(val);
    }
  }
  const autoTags = [];
  if (org && org.name) autoTags.push(org.name);
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (cell.type === 'gosnumber'){
      const txt = (cell.html||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
      if (txt) autoTags.push(txt);
    }
  }
  const finalTags = uniq([...(tpl.tags||[]), ...autoTags]);

  const snapshot = clone({
    cols: tpl.cols, rows: tpl.rows, cells: resolvedCells,
    fontFamily: tpl.fontFamily, fontSize: tpl.fontSize, pagePadding: tpl.pagePadding
  });
  db.documents.push({
    id: uid(), templateId: tpl.id, templateName: tpl.name,
    name: name.trim()||defName, createdAt: Date.now(),
    tags: finalTags, data: snapshot
  });
  saveDB();
  const tagMsg = finalTags.length ? ' Теги: ' + finalTags.join(', ') : '';
  toast('Копия сохранена.' + tagMsg, 'success');
}

function exportDB(){
  saveDB();
  const payload = {
    version: 7, exportedAt: new Date().toISOString(), unit,
    templates: db.templates, documents: db.documents,
    tireCalcs: db.tireCalcs, kwCalcs: db.kwCalcs,
    instructions: db.instructions, organizations: db.organizations,
    routes: db.routes || [],
    works: db.works || [],
    materials: db.materials || []
  };
  downloadJSON(payload, `avtocom-full-${new Date().toISOString().slice(0,10)}.json`);
  toast('База данных выгружена','success');
}
function importDB(){
  pickJSONFile(data=>{
    if (!data || !Array.isArray(data.templates)){ toast('Неверный формат файла БД','error'); return; }
    showDBImportDialog(data);
  });
}
function showDBImportDialog(data){
  const ov = document.createElement('div'); ov.className='modal-overlay';
  const modal = document.createElement('div'); modal.className='modal';
  modal.innerHTML = `
    <h3>📦 Импорт базы данных</h3>
    <p>
      Что сделать с текущими данными?<br><br>
      <b>Слить</b> — добавить записи из файла, которых нет сейчас. Существующие сохранятся.<br><br>
      <b>Заменить</b> — полностью стереть текущие данные и загрузить только то, что в файле.
    </p>
    <div class="modal-actions">
      <button type="button" data-mode="cancel">Отмена</button>
      <button type="button" class="primary" data-mode="merge">📥 Слить</button>
      <button type="button" class="danger" data-mode="replace">🔄 Заменить</button>
    </div>`;
  ov.appendChild(modal); document.body.appendChild(ov);
  ov.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=>{
      const m = b.dataset.mode;
      ov.remove();
      if (m==='cancel') return;
      if (m==='merge') mergeDB(data);
      else replaceDB(data);
    };
  });
}
function replaceDB(data){
  db.templates    = data.templates.map(normalizeTemplate);
  db.documents    = (Array.isArray(data.documents)?data.documents:[]).map(normalizeDoc);
  db.tireCalcs    = Array.isArray(data.tireCalcs)?data.tireCalcs:[];
  db.kwCalcs      = Array.isArray(data.kwCalcs)?data.kwCalcs:[];
  db.instructions = (Array.isArray(data.instructions)?data.instructions:[]).map(normalizeInstr);
  db.organizations = (Array.isArray(data.organizations)?data.organizations:[]).map(normalizeOrg);
  db.routes       = (Array.isArray(data.routes)?data.routes:[]).map(normalizeRoute);
  db.works     = (Array.isArray(data.works)?data.works:[]).map(x => normalizeRefItem(x, 'work'));
  db.materials = (Array.isArray(data.materials)?data.materials:[]).map(x => normalizeRefItem(x, 'material'));
  if (['px','cm','mm'].includes(data.unit)){ unit = data.unit; saveJSON(UNIT_KEY, unit); }
  saveDB();
  activeSection = 'docs'; docsView = 'list';
  activeTemplateId = null; selection = null; viewingDoc = null; editingInstruction = null;
  editingRoute = null; routeRunState = null; routesView = 'list';
  render();
  toast('База данных заменена','success');
}
function mergeDB(data){
  const counts = { templates:0, documents:0, tireCalcs:0, kwCalcs:0, instructions:0, organizations:0, routes:0, works:0, materials:0 };
  const mergeOne = (target, incoming, norm)=>{
    const ids = new Set(target.map(x=>x.id));
    let n = 0;
    (incoming||[]).forEach(item=>{
      if (!item || typeof item !== 'object') return;
      if (item.id && ids.has(item.id)) return;
      let c = clone(item);
      if (norm) c = norm(c);
      if (!c.id) c.id = uid();
      ids.add(c.id);
      target.push(c);
      n++;
    });
    return n;
  };
  counts.templates     = mergeOne(db.templates,     data.templates,     normalizeTemplate);
  counts.documents     = mergeOne(db.documents,     data.documents,     normalizeDoc);
  counts.tireCalcs     = mergeOne(db.tireCalcs,     data.tireCalcs,     null);
  counts.kwCalcs       = mergeOne(db.kwCalcs,       data.kwCalcs,       null);
  counts.instructions  = mergeOne(db.instructions,  data.instructions,  normalizeInstr);
  counts.organizations = mergeOne(db.organizations, data.organizations, normalizeOrg);
  counts.routes = mergeOne(db.routes, data.routes, normalizeRoute);
  counts.works     = mergeOne(db.works,     data.works,     x => normalizeRefItem(x, 'work'));
  counts.materials = mergeOne(db.materials, data.materials, x => normalizeRefItem(x, 'material'));
  saveDB(); render();
  const total = Object.values(counts).reduce((s,n)=>s+n,0);
  if (total === 0) toast('Новых записей не найдено','info');
    else toast(`Добавлено: шабл. ${counts.templates}, копий ${counts.documents}, орг. ${counts.organizations}, работ ${counts.works}, мат. ${counts.materials}, W ${counts.tireCalcs}, K/W ${counts.kwCalcs}, спр. ${counts.instructions}, маршр. ${counts.routes}`,'success');
}

   ============================================================ */
document.addEventListener('keydown', e=>{
  const inner = document.activeElement;
  const inField = inner && (
    inner.isContentEditable ||
    inner.tagName === 'INPUT' || inner.tagName === 'TEXTAREA' || inner.tagName === 'SELECT'
  );
  if (e.key === 'Escape'){
    closeAllDropdowns();
    if (inner && inner.isContentEditable){ blurActiveEditable(); e.preventDefault(); return; }
  }
    /* === Горячие клавиши раннера маршрутов === */
  if (activeSection === 'routes' && routesView === 'runner' && routeRunState && !inField){
    const r = db.routes.find(x => x.id === routeRunState.routeId);
    const st = r && getRouteStep(r, routeRunState.currentStepId);

    if (e.key === 'Escape'){
      e.preventDefault();
      routesView = 'list'; routeRunState = null; render();
      return;
    }
    if (st){
      const nl = st.next.filter(n => n.targetStepId);
      if (e.key === 'ArrowLeft' && routeRunState.history.length > 1){
        e.preventDefault();
        routeRunState.history.pop();
        routeRunState.currentStepId = routeRunState.history[routeRunState.history.length - 1];
        render();
        return;
      }
      if (e.key === 'ArrowRight' && nl.length === 1){
        e.preventDefault();
        routeRunState.currentStepId = nl[0].targetStepId;
        routeRunState.history.push(nl[0].targetStepId);
        render();
        return;
      }
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImg && !inField){
    if (removeSelectedImage()){
      const tpl = getCurrent();
      if (tpl){
        const tds = document.querySelectorAll('.sheet-table td');
        for (const td of tds){
          const innerDiv = td.querySelector('.cell-inner');
          if (!innerDiv) continue;
          const cell = getCell(tpl, +td.dataset.r, +td.dataset.c);
          if (innerDiv.innerHTML !== cell.html){ cell.html = innerDiv.innerHTML; touch(tpl); }
        }
      }
      e.preventDefault();
      return;
    }
  }
  if (activeSection === 'docs' && docsView === 'editor' && mode === 'design'){
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (inField) return;
      const tpl = getCurrent();
      if (!tpl || !selection) return;
      e.preventDefault();
      applySel(c=>{ c.html = ''; c.value = ''; });
    }
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'p'){
    e.preventDefault();
    /* Если открыт печатный прайс — учитываем ориентацию */
    if (activeSection === 'orgs' && refsTab === 'print'){
      const isLandscape = refsPrintOpts.orgId === '__all__' && db.organizations.length > 1;
      setPrintOrientation(isLandscape ? 'landscape' : 'portrait');
      setTimeout(() => window.print(), 50);
    } else {
      window.print();
    }
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){
    if (editingInstruction){ e.preventDefault(); saveInstructionNow(); render(); }
  }
});

/* ============================================================
   АСИНХРОННАЯ ИНИЦИАЛИЗАЦИЯ — загружаем БД из IndexedDB
   ============================================================ */
(async () => {
  try {
    applyUserSettings();
    /* Автопроверка обновлений раз в 24 часа */
    if (userSettings.updateUrl){
      const last = userSettings.lastUpdateCheck || 0;
      const dayMs = 24 * 60 * 60 * 1000;
      if (Date.now() - last > dayMs){
        setTimeout(() => { try { checkForUpdates({ silent: true }); } catch(_){} }, 3000);
      }
    }
    if (_EMBEDDED && _EMBEDDED.db){
      /* ===== РЕЖИМ КОПИИ — данные из встроенного JSON ===== */
      db = {
        templates:     _EMBEDDED.db.templates     || [],
        documents:     _EMBEDDED.db.documents     || [],
        tireCalcs:     _EMBEDDED.db.tireCalcs     || [],
        kwCalcs:       _EMBEDDED.db.kwCalcs       || [],
        instructions:  _EMBEDDED.db.instructions  || [],
        organizations: _EMBEDDED.db.organizations || [],
        routes:        _EMBEDDED.db.routes        || [],
        works:         _EMBEDDED.db.works         || [],
        materials:     _EMBEDDED.db.materials     || []
      };
      if (_EMBEDDED.draft && _EMBEDDED.draft.cols) draft = _EMBEDDED.draft;
      normalizeTemplate(draft);
      if (_EMBEDDED.meta && _EMBEDDED.meta.readOnly){
        window.__AVTOCOM_READONLY__ = true;
      }
      try { showEmbeddedBanner(_EMBEDDED.meta); } catch(_){}
      console.log('[Копия] Данные загружены из встроенного JSON', _EMBEDDED.meta || {});
    } else {
      /* ===== ОБЫЧНЫЙ РЕЖИМ — загрузка из IndexedDB ===== */
      db = await loadMigratedDB();
      const draftLoaded = await loadJSON_async(DRAFT_KEY, null) || await loadJSON_async(DRAFT_KEY_V2, null);
      draft = (draftLoaded && draftLoaded.cols && draftLoaded.rows)
        ? draftLoaded
        : defaultTemplate('Новый документ');
      normalizeTemplate(draft);

      const info = await idbInfo();
      if (info){
        const usageMb = (info.usage / 1024 / 1024).toFixed(2);
        const quotaMb = (info.quota / 1024 / 1024).toFixed(0);
        console.log('[Хранилище] Занято: ' + usageMb + ' МБ из ' + quotaMb + ' МБ (IndexedDB)');
      }
    }

    /* Отрисовка */
    render();
  } catch (e){
    console.error('Ошибка инициализации:', e);
    try { applyUserSettings(); } catch(_){}
    render();
  }
})();
</script>
