<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АВТОКОМ</title>

<style>
  :root {
    --bg:#eef2f7; --panel:#fff; --panel-2:#f8fafc;
    --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
    --border:#e2e8f0; --border-2:#cbd5e1;
    --primary:#2563eb; --primary-hover:#1d4ed8; --primary-soft:#dbeafe;
    --danger:#dc2626; --danger-soft:#fee2e2;
    --success:#059669; --success-soft:#d1fae5;
    --warning:#d97706; --warning-soft:#fef3c7;
    --header:#0f172a; --header-2:#1e293b; --header-3:#334155; --header-4:#475569;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 14px rgba(15,23,42,.08);
    --shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --radius:10px; --radius-lg:14px; --radius-sm:7px;
    --t:.18s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#e2e8f0 100%);color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box;}

  header{background:var(--header);color:#e2e8f0;flex:0 0 auto;box-shadow:0 2px 10px rgba(15,23,42,.25);z-index:20;}
  .tabs{display:flex;align-items:flex-end;gap:4px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{display:flex;align-items:center;gap:8px;padding:11px 20px;background:transparent;color:#94a3b8;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:500;user-select:none;transition:background var(--t),color var(--t);position:relative;}
  .tab:hover{background:var(--header-2);color:#e2e8f0;}
  .tab.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 -2px 8px rgba(15,23,42,.08);}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--primary);border-radius:3px 3px 0 0;animation:tabIn .25s ease-out;}
  @keyframes tabIn{from{transform:scaleX(0);opacity:0;}to{transform:scaleX(1);opacity:1;}}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--header-2);border-top:1px solid var(--header-3);min-height:52px;}
  .btn{padding:7px 13px;border-radius:var(--radius-sm);border:1px solid var(--header-3);background:var(--header-3);color:#e2e8f0;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background var(--t),border-color var(--t),transform .1s;font-family:inherit;}
  .btn:hover{background:var(--header-4);border-color:var(--header-4);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.35);}
  .btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn.danger:hover{background:#ef4444;border-color:#ef4444;}
  .btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.mini{padding:4px 9px;font-size:12px;min-width:34px;justify-content:center;}
  .card-btn{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border-2);background:#fff;color:var(--text-2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all var(--t);}
  .card-btn:hover{background:var(--panel-2);border-color:var(--primary);color:var(--primary);}
  .card-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .card-btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff;}
  .card-btn.danger{color:var(--danger);border-color:#fecaca;background:#fff;}
  .card-btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .unit-group{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 12px;background:rgba(0,0,0,.25);border-radius:9px;border:1px solid var(--header-3);}
  .unit-group .lbl{font-size:10.5px;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .unit-group .btn.mini{padding:4px 9px;min-width:32px;background:transparent;border-color:transparent;color:#94a3b8;}
  .unit-group .btn.mini:hover{background:var(--header-3);color:#e2e8f0;}
  .unit-group .btn.mini.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.35);}

  .workspace{flex:1;display:flex;overflow:hidden;}
  .sheet-area{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch;}
  .sheet-area.tall{display:block;padding:32px;}
  .sidebar{width:320px;flex:0 0 320px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:18px 16px;box-shadow:-4px 0 16px rgba(15,23,42,.03);}
  .sidebar.hidden{display:none;}

  .a4{width:210mm;min-height:297mm;background:#fff;box-shadow:0 8px 32px rgba(15,23,42,.16);flex:0 0 auto;position:relative;border-radius:2px;}
  .a4.plain{padding:12mm;}
  .a4.landscape{
  width: 297mm;
  min-height: 210mm;
}
  /* ============================================================
   МЕТКИ РАЗРЫВА СТРАНИЦ A4
   ============================================================ */
.page-break-marker{
  position: absolute;
  left: 0; right: 0;
  height: 0;
  border-top: 2px dashed #f59e0b;
  pointer-events: none;
  z-index: 60;
}



/* Лёгкая штриховка под линией, чтобы сразу видно было «здесь начинается следующий лист» */
.page-break-marker::before{
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0; height: 14px;
  background: repeating-linear-gradient(
    -45deg,
    rgba(245,158,11,.08),
    rgba(245,158,11,.08) 6px,
    transparent 6px,
    transparent 12px
  );
}
.page-break-marker::after{
  content: attr(data-label);
  position: absolute;
  right: 12px;
  top: -11px;
  background: #f59e0b;
  color: #fff;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  box-shadow: 0 2px 6px rgba(245,158,11,.45);
  white-space: nowrap;
}
@media print{
  .page-break-marker{ display: none !important; }
}
  .ruler-cols{position:absolute;top:0;right:0;left:0;height:22px;display:flex;background:var(--panel-2);border-bottom:1px solid var(--border-2);overflow:hidden;user-select:none;z-index:4;}
  .col-head{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#64748b;border-right:1px solid #e2e8f0;background:var(--panel-2);user-select:none;position:relative;overflow:hidden;}
  .col-head::after{content:'';position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:20;}
  .col-head:hover{background:var(--primary-soft);color:var(--primary);}
  .col-head.active{background:#bfdbfe;color:#1e40af;}
  .col-head .resizer-line{position:absolute;right:0;top:4px;bottom:4px;width:1px;background:transparent;pointer-events:none;}
  .col-head:hover .resizer-line{background:var(--primary);}
  .ruler-rows{position:absolute;left:0;bottom:0;top:0;width:28px;display:flex;flex-direction:column;background:var(--panel-2);border-right:1px solid var(--border-2);overflow:hidden;user-select:none;z-index:3;}
  .row-head{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-size:10px;font-weight:600;color:#64748b;border-bottom:1px solid #e2e8f0;background:var(--panel-2);position:relative;overflow:hidden;}
  .row-head::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:7px;cursor:row-resize;z-index:20;}
  .row-head:hover{background:var(--primary-soft);color:var(--primary);}
  .row-head.active{background:#bfdbfe;color:#1e40af;}
  .row-head .resizer-line{position:absolute;bottom:0;left:4px;right:4px;height:1px;background:transparent;pointer-events:none;}
  .row-head:hover .resizer-line{background:var(--primary);}
  .ruler-corner{position:absolute;top:0;left:0;width:28px;height:22px;background:var(--panel-2);border-right:1px solid var(--border-2);border-bottom:1px solid var(--border-2);z-index:5;}

  .sheet-table{border-collapse:collapse;table-layout:fixed;width:100%;}
  .sheet-table td{padding:0;position:relative;overflow:hidden;height:1px;border:0;line-height:0;}
  .a4.editable .sheet-table td{border-top:1px dashed var(--border-2);border-right:1px dashed var(--border-2);border-bottom:1px dashed var(--border-2);border-left:1px dashed var(--border-2);}

  .cell-inner{
  position:absolute;inset:0;
  padding:1px 3px;                
  box-sizing:border-box;overflow:hidden;outline:none;border-radius:3px;
  display:flex;flex-direction:column;
  white-space:pre-wrap;word-break:break-word;min-width:0;
  line-height:1.15;                
  transition:background var(--t);
}
  .cell-inner > * { flex: 0 0 auto; }
  .cell-inner[data-valign="top"]    { justify-content: flex-start; }
  .cell-inner[data-valign="middle"] { justify-content: center; }
  .cell-inner[data-valign="bottom"] { justify-content: flex-end; }
  .cell-inner:empty::before{content:'\200b';}
  .cell-inner:focus{background:rgba(37,99,235,.08);outline:2px solid var(--primary);outline-offset:-1px;}
  .cell-inner img{max-width:100%;height:auto;border-radius:4px;display:inline-block;vertical-align:middle;margin:2px;cursor:pointer;flex:0 0 auto;}
  .cell-inner img.img-selected{outline:3px solid var(--primary);outline-offset:2px;cursor:nwse-resize;}
  .cell-inner.placeholder{color:#94a3b8;font-style:italic;}
  /* Защищённые от редактирования ячейки в режиме заполнения */
  .cell-inner.locked{
    cursor: default;
    color: var(--text-3);
  }
  /* Вычислимые ячейки — заполняются автоматически, вручную не редактируются */
  .cell-inner[data-computed="1"]{
    background: rgba(37,99,235,.03);
    cursor: default;
  }
  .cell-inner[data-computed="1"]:hover{
    background: rgba(37,99,235,.06);
  }
    .cell-inner.locked:hover{ background: transparent; }

  /* Пометка редактируемых ячеек в конструкторе */
  .sheet-table td.editable-cell{
    background-image: linear-gradient(0deg, rgba(124,58,237,.05), rgba(124,58,237,.05));
  }
  .edit-badge{
    position: absolute; left: 2px; top: 1px; font-size: 10px;
    color: #7c3aed; background: #ede9fe;
    border-radius: 3px; padding: 0 3px;
    pointer-events: none; z-index: 3;
  }
  @media print{
    .edit-badge{ display: none !important; }
  }

    /* ====== РЕЖИМ ЧТЕНИЯ В СПРАВОЧНИКЕ ====== */
  .instr-editor.read-mode .instr-title-input{
    padding-top: 22px;                       /* компенсируем отсутствие тулбара */
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    cursor: default;
    pointer-events: none;                    /* исключаем появление каретки */
  }
  .instr-editor.read-mode .instr-title-input:focus{
    outline: none;
  }
  .instr-editor.read-mode .instr-content{
    cursor: default;
    user-select: text;                       /* текст можно выделять и копировать */
  }
  .instr-editor.read-mode .instr-content img{
    cursor: zoom-in;
    transition: outline .15s;
  }
  .instr-editor.read-mode .instr-content img:hover{
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  @media print{
    .instr-editor.read-mode .instr-title-input{
      pointer-events: auto;
    }
  }

  /* ============================================================
   РАННЕР МАРШРУТА — v2 со sticky-навигацией и списком шагов
   ============================================================ */
.route-runner{
  width:100%;max-width:1400px;margin:0 auto;
}

/* === Sticky верхняя панель === */
.route-sticky{
  position:sticky;top:0;z-index:30;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:10px 16px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(15,23,42,.10);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.route-sticky-title{
  font-size:15px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;min-width:120px;
}
.route-sticky-title .badge{
  font-size:11px;background:var(--primary-soft);color:var(--primary);
  padding:2px 8px;border-radius:10px;font-weight:700;margin-left:8px;
  vertical-align:middle;
}
.route-sticky-nav{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.route-nav-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;
  border:1px solid var(--border-2);background:#fff;color:var(--text);
  cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
  transition:all .15s;white-space:nowrap;
}
.route-nav-btn:hover:not(.disabled){
  background:var(--primary);border-color:var(--primary);color:#fff;
  transform:translateY(-1px);box-shadow:var(--shadow-md);
}
.route-nav-btn.primary{
  background:var(--primary);border-color:var(--primary);color:#fff;
}
.route-nav-btn.primary:hover{
  background:var(--primary-hover);border-color:var(--primary-hover);
}
.route-nav-btn.disabled{opacity:.35;cursor:not-allowed;}
.route-nav-btn .arr{font-size:16px;line-height:1;font-weight:700;}

/* === 2-колоночный layout === */
.route-layout{
  display:grid;grid-template-columns:280px 1fr;gap:16px;
  align-items:start;
}

/* === Левая панель — список шагов === */
.route-steps{
  position:sticky;top:calc(var(--route-sticky-h, 64px) + 8px);
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:10px;
  box-shadow:var(--shadow-sm);
  max-height:calc(100vh - 120px);overflow-y:auto;
}
.route-steps-head{
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-3);font-weight:700;padding:6px 8px 10px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.route-step-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;border-radius:7px;cursor:pointer;
  margin-bottom:3px;transition:all .12s;
  border:1px solid transparent;
}
.route-step-item:hover{
  background:var(--panel-2);
  border-color:var(--border-2);
}
.route-step-item.current{
  background:var(--primary);color:#fff;
  border-color:var(--primary);
}
.route-step-item.current .route-step-num{color:#fff;}
.route-step-item.current .route-step-title{color:#fff;font-weight:600;}
.route-step-item.passed .route-step-num{color:var(--success);}
.route-step-item.current.passed .route-step-num{color:#fff;}

.route-step-num{
  flex:0 0 auto;min-width:22px;font-weight:700;font-size:12px;
  color:var(--text-3);line-height:1.35;padding-top:1px;
}
.route-step-title{
  flex:1;font-size:13px;color:var(--text);line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  line-clamp:2;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.route-step-branch-tag{
  font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--warning-soft);color:#92400e;font-weight:600;
  flex:0 0 auto;align-self:center;
}
.route-step-item.current .route-step-branch-tag{
  background:rgba(255,255,255,.25);color:#fff;
}

/* === Правая колонка — контент шага === */
.route-content-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px 28px;
  box-shadow:var(--shadow-sm);min-width:0;
}
.route-step-title-h1{
  font-size:22px;font-weight:700;color:var(--text);
  margin:0 0 4px;letter-spacing:-.01em;
}
.route-step-subtitle{
  font-size:12.5px;color:var(--text-3);margin-bottom:18px;
}
.route-content-body{
  font-size:14.5px;line-height:1.75;color:var(--text);
  word-wrap:break-word;
}
.route-content-body img{
  max-width:100%;height:auto;border-radius:6px;
  margin:6px 2px;display:inline-block;vertical-align:middle;
  cursor:zoom-in;transition:outline .15s;
}
.route-content-body img:hover{outline:2px solid var(--primary);outline-offset:2px;}
.route-content-body h1{font-size:24px;margin:18px 0 10px;}
.route-content-body h2{font-size:19px;margin:16px 0 8px;}
.route-content-body h3{font-size:16px;margin:14px 0 6px;}
.route-content-body p{margin:0 0 10px;}
.route-content-body ul,.route-content-body ol{margin:0 0 10px 22px;}
.route-content-body table{border-collapse:collapse;margin:10px 0;}
.route-content-body table td{border:1px solid var(--border-2);padding:6px 10px;}

.route-next-head{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--border);
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-3);font-weight:700;margin-bottom:12px;
}
.route-next-buttons{display:flex;flex-direction:column;gap:10px;}
.route-next-btn{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--border-2);
  cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--text);text-align:left;transition:all .15s;
}
.route-next-btn:hover{
  background:var(--primary);border-color:var(--primary);color:#fff;
  transform:translateX(3px);
}
.route-next-btn .arrow{
  font-size:20px;flex:0 0 auto;color:var(--primary);
  transition:color .15s;
}
.route-next-btn:hover .arrow{color:#fff;}
.route-next-btn .btn-label{flex:1;}
.route-next-btn .btn-target{
  font-size:11.5px;color:var(--text-3);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px;
}
.route-next-btn:hover .btn-target{color:rgba(255,255,255,.75);}

.route-finish-box{
  margin-top:24px;padding:22px;
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  border:1px solid #6ee7b7;border-radius:12px;text-align:center;
}
.route-finish-box .big{font-size:36px;display:block;margin-bottom:8px;}
.route-finish-box .ttl{font-size:16px;font-weight:700;color:#065f46;margin-bottom:6px;}
.route-finish-box .sub{font-size:13px;color:#047857;margin-bottom:14px;}
.route-finish-box .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

.route-empty-step{
  color:var(--text-3);font-style:italic;padding:20px;
  text-align:center;border:2px dashed var(--border-2);border-radius:10px;
}

/* === Адаптив === */
@media (max-width:900px){
  .route-layout{grid-template-columns:1fr;}
  .route-steps{
    position:static;max-height:none;
    display:flex;flex-direction:row;flex-wrap:nowrap;
    overflow-x:auto;gap:6px;padding:8px;
  }
  .route-steps-head{display:none;}
  .route-step-item{
    flex:0 0 auto;min-width:150px;max-width:200px;
    margin-bottom:0;
  }
  .route-sticky{padding:8px 12px;}
  .route-sticky-title{font-size:13.5px;}
  .route-nav-btn{padding:7px 10px;font-size:12.5px;}
  .route-nav-btn .lbl{display:none;}
  .route-content-card{padding:16px;}
}

@media print{

.preview-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.85);
  display:flex;align-items:center;justify-content:center;
  z-index:100100;padding:16px;animation:ovIn .15s ease-out;
}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.preview-modal{
  background:#fff;border-radius:12px;
  width:min(95vw,1400px);height:min(92vh,900px);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.preview-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;
  flex-wrap:wrap;flex:0 0 auto;
}
.preview-title{
  flex:1;font-size:13.5px;font-weight:600;color:#0f172a;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px;
}
.preview-controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap;}
.preview-controls button{
  min-width:32px;height:30px;padding:0 10px;
  border:1px solid #cbd5e1;background:#fff;border-radius:6px;
  cursor:pointer;font-family:inherit;font-size:13px;color:#374151;
  transition:all .15s;
}
.preview-controls button:hover{background:#f1f5f9;border-color:#2563eb;color:#2563eb;}
.preview-controls input[type="range"]{width:140px;cursor:pointer;}
.preview-zoom-val{
  font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  color:#64748b;min-width:46px;text-align:right;
}
.preview-close{
  width:34px;height:34px;border-radius:8px;border:none;
  background:transparent;cursor:pointer;font-size:22px;
  color:#64748b;line-height:1;flex:0 0 auto;
}
.preview-close:hover{background:#fee2e2;color:#dc2626;}
.preview-viewport{
  flex:1;overflow:hidden;background:#1e293b;position:relative;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;user-select:none;
}
.preview-viewport:active{cursor:grabbing;}
.preview-viewport img{
  max-width:none;max-height:none;
  transform-origin:center center;
  will-change:transform;
  pointer-events:none;display:block;
}

.drop-zone{
  border:2px dashed var(--border-2);
  border-radius:12px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;
  transition:all .18s;
  background:var(--panel-2);
  color:var(--text-2);
}
.drop-zone:hover,.drop-zone.dragover{
  border-color:var(--primary);
  background:var(--primary-soft);
  color:var(--primary);
}
.drop-zone .big-icon{font-size:32px;display:block;margin-bottom:8px;opacity:.7;}
.drop-zone .hint-sm{font-size:12px;color:var(--text-3);margin-top:4px;}
.drop-zone.has-file{
  border-style:solid;
  border-color:var(--success);
  background:var(--success-soft);
  color:var(--success);
}

.conv-options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
  margin:18px 0;
}
.conv-options .full{grid-column:1 / -1;}
.conv-options label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
.conv-options input,.conv-options select{
  width:100%;padding:8px 11px;border:1px solid var(--border-2);
  border-radius:8px;font:inherit;font-size:13px;background:#fff;font-family:inherit;
}
.conv-options input:focus,.conv-options select:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.conv-filelist{
  margin-top:12px;display:flex;flex-direction:column;gap:6px;
  max-height:220px;overflow-y:auto;
}
.conv-file-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:#fff;border:1px solid var(--border);border-radius:6px;font-size:12px;
}
.conv-file-item .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conv-file-item .fsize{color:var(--text-3);font-size:11px;flex:0 0 auto;}
.conv-file-item .fdel{
  flex:0 0 auto;border:none;background:transparent;color:var(--danger);
  cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;
}
.conv-file-item .fdel:hover{background:var(--danger-soft);}

.conv-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

.conv-progress{
  margin-top:18px;padding:14px 18px;border-radius:10px;
  background:var(--primary-soft);color:#1e40af;font-size:13.5px;
  display:none;
}
.conv-progress.show{display:block;}
.conv-progress .bar{
  height:6px;background:rgba(37,99,235,.2);border-radius:3px;
  overflow:hidden;margin-top:8px;
}
.conv-progress .bar > div{
  height:100%;background:var(--primary);width:0%;transition:width .2s;
}

.conv-results{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
.conv-result-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--success-soft);border:1px solid #a7f3d0;
  border-radius:8px;font-size:13px;
}
.conv-result-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conv-result-item .name b{color:#065f46;}
.conv-result-item .dl{
  padding:5px 10px;border-radius:6px;background:var(--success);color:#fff;
  font-size:12px;font-weight:600;border:none;cursor:pointer;
  font-family:inherit;text-decoration:none;
}
.conv-result-item .dl:hover{background:#047857;}

  @media print{
    @page{size:A4;margin:0;}
    html,body{height:auto !important;overflow:visible !important;background:#fff !important;}
    body{display:block !important;}
    header,.sidebar,.no-print,.resize-tip,.toast-host,.modal-overlay,.custom-select-dropdown{display:none !important;}
    .workspace{display:block !important;overflow:visible !important;height:auto !important;}
    .sheet-area{display:block !important;padding:0 !important;overflow:visible !important;height:auto !important;}
    .a4{box-shadow:none !important;margin:0 !important;width:210mm !important;min-height:0 !important;}
        /* Лист прайса — на всю печатную область */
    .list-wrap.print-visible .a4{
      width: 100% !important;
      max-width: 100% !important;
      min-height: 0 !important;
      padding: 8mm !important;
      margin: 0 !important;
      box-shadow: none !important;
    }
    .list-wrap.print-visible .a4.landscape{
      width: 100% !important;
    }
    .ruler-corner,.ruler-cols,.ruler-rows{display:none !important;}
    .a4.editable .sheet-table td{border-color:transparent;}
    .sheet-table td.sel::after{display:none !important;}
    .cell-inner:focus{background:none !important;outline:none !important;}
    .cell-inner[data-computed="1"]{background: transparent !important;}
    .cell-inner.placeholder{color:transparent !important;font-style:normal !important;}
    .custom-select::after{display:none !important;}
    .select-badge{display:none !important;}
    .cell-inner img.img-selected,.instr-content img.img-selected{outline:none !important;}
    .list-wrap,.tools-wrap,.instr-wrap,.empty-state{ display: none !important; }
    #refs-print-wrap,
    #refs-print-wrap .list-wrap{ display: block !important; }
    #refs-print-wrap .filter-bar{ display: none !important; }
    #refs-print-wrap .list-head{ display: none !important; }
    #refs-print-wrap .subtabs{ display: none !important; }
    #refs-print-wrap .a4{
      width: 100% !important;
      max-width: 100% !important;
      min-height: 0 !important;
      padding: 8mm !important;
      margin: 0 !important;
      box-shadow: none !important;
    }
    #refs-print-wrap table{ break-inside: auto !important; page-break-inside: auto !important; }
    #refs-print-wrap tbody tr{ break-inside: avoid !important; page-break-inside: avoid !important; }
    #refs-print-wrap thead{ display: table-header-group !important; }
    /* Печать прайса — показываем контейнер, скрываем фильтры */
    .list-wrap.print-visible{display:block !important;}
    .list-wrap.print-visible .filter-bar{display:none !important;}
    .list-wrap.print-visible .list-head{display:none !important;}
        /* 1. Возвращаем обычный цвет текста в заблокированных ячейках */
    .cell-inner.locked,
    .cell-inner.placeholder{
      color: inherit !important;
      background: transparent !important;
    }
    .sheet-table td.locked-cell{
      color: inherit !important;
      background: transparent !important;
    }
    /* Плейсхолдеры «{Наименование}» тоже делаем нормальными */
    .cell-inner.placeholder{
      font-style: normal !important;
    }
        /* Прайс: разрешаем таблице разрываться между страницами,
       но запрещаем рвать отдельные строки */
    .list-wrap.print-visible table{ break-inside: auto !important; page-break-inside: auto !important; }
    .list-wrap.print-visible tbody tr{ break-inside: avoid !important; page-break-inside: avoid !important; }
    .list-wrap.print-visible thead{ display: table-header-group !important; }
  }

  /* ============================================================
   ТЁМНАЯ ТЕМА
   ============================================================ */
body.theme-dark{
  --bg:#0b1220;
  --panel:#111a2e;
  --panel-2:#16213a;
  --text:#e2e8f0;
  --text-2:#94a3b8;
  --text-3:#64748b;
  --border:#1e293b;
  --border-2:#334155;
  --header:#050a15;
  --header-2:#0f172a;
  --header-3:#1e293b;
  --header-4:#334155;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --primary-soft:#1e3a8a;
  --success-soft:#064e3b;
  --warning-soft:#78350f;
  --danger-soft:#7f1d1d;
  background: linear-gradient(180deg,#0b1220 0%,#0f172a 100%) !important;
}
/* ============================================================
   ТЁМНАЯ ТЕМА — доработки
   ============================================================ */

/* Поисковые поля и селекты в фильтрах */
body.theme-dark .filter-bar{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .filter-search,
body.theme-dark .filter-sort{
  background: var(--panel-2) !important;
  color: var(--text) !important;
  border-color: var(--border-2) !important;
}
body.theme-dark .filter-search::placeholder{ color: var(--text-3); }

/* Заголовки разделов и подразделов */
body.theme-dark .list-head h2{ color: var(--text); }
body.theme-dark .subsection h3{
  color: var(--text-2);
  border-bottom-color: var(--border);
}
body.theme-dark .count-badge{
  background: #1e3a8a; color: #bfdbfe;
}

/* Чипы фильтров (теги) */
body.theme-dark .filter-chip{
  background: var(--panel-2);
  border-color: var(--border-2);
  color: var(--text-2);
}
body.theme-dark .filter-chip:hover{
  background: var(--primary-soft);
  color: #fff;
  border-color: var(--primary);
}
body.theme-dark .filter-label{ color: var(--text-3); }

/* Карточки (шаблоны, копии, справочник, маршруты) */
body.theme-dark .item-card{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .item-title{ color: var(--text); }
body.theme-dark .item-meta{ color: var(--text-2); }
body.theme-dark .item-actions{ border-top-color: var(--border); }
body.theme-dark .card-btn{
  background: var(--panel-2);
  border-color: var(--border-2);
  color: var(--text-2);
}
body.theme-dark .card-btn:hover{
  background: var(--primary-soft);
  color: #fff;
  border-color: var(--primary);
}
body.theme-dark .card-btn.danger{
  background: var(--panel-2);
  border-color: #7f1d1d;
  color: #fca5a5;
}
body.theme-dark .card-btn.danger:hover{
  background: #7f1d1d;
  color: #fff;
}

/* Теги в карточках */
body.theme-dark .card-tag{ background: #1e3a8a; color: #bfdbfe; }
body.theme-dark .card-tag.b{ background: #831843; color: #fbcfe8; }
body.theme-dark .card-tag.g{ background: #064e3b; color: #a7f3d0; }
body.theme-dark .card-tag.y{ background: #78350f; color: #fde68a; }

/* Бейджи-категории в правом верхнем углу карточек */
body.theme-dark .item-badge{ background: #064e3b; color: #6ee7b7; }
body.theme-dark .item-badge.blue{ background: #1e3a8a; color: #93c5fd; }
body.theme-dark .item-badge.amber{ background: #78350f; color: #fcd34d; }
body.theme-dark .item-badge.org{ background: #312e81; color: #c7d2fe; }

/* Инструменты */
body.theme-dark .tools-card{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .tools-card h3{ color: var(--text); }
body.theme-dark .tools-card .subtitle{ color: var(--text-2); }
body.theme-dark .formula-tag{
  background: var(--panel-2);
  color: var(--text-2);
  border-color: var(--border);
}
body.theme-dark .form-grid label{ color: var(--text-2); }
body.theme-dark .form-grid input{
  background: var(--panel-2);
  color: var(--text);
  border-color: var(--border-2);
}
body.theme-dark .form-grid input:focus{ border-color: var(--primary); }

/* Результат расчёта — тёмно-синяя плашка */
body.theme-dark .result-box{
  background: linear-gradient(180deg, #0c2a4a 0%, #0a1f3a 100%);
  border-color: #1e3a5f;
}
body.theme-dark .result-box.error{
  background: linear-gradient(180deg, #450a0a 0%, #3a0808 100%);
  border-color: #7f1d1d;
}
body.theme-dark .result-row{ border-bottom-color: #1e3a5f; }
body.theme-dark .result-row .lbl{ color: #93c5fd; }
body.theme-dark .result-row .val{ color: #bfdbfe; }
body.theme-dark .result-row.highlight .lbl{ color: #bfdbfe; }
body.theme-dark .result-row.highlight .val{ color: #6ee7b7; }
body.theme-dark .result-box.error .result-row{ border-color: #7f1d1d; }
body.theme-dark .result-box.error .result-row .lbl{ color: #fca5a5; }

/* Подвкладки (Коммерция, Инструменты, Конвертер) */
body.theme-dark .subtabs{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .subtab{ color: var(--text-2); }
body.theme-dark .subtab:hover{
  background: var(--panel-2);
  color: var(--text);
}

/* Пустые состояния */
body.theme-dark .empty-state{
  background: var(--panel);
  border-color: var(--border-2);
  color: var(--text-2);
}

/* Редактор инструкции */
body.theme-dark .instr-editor{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .instr-toolbar{
  background: var(--panel-2);
  border-color: var(--border);
}
body.theme-dark .instr-toolbar button.ib{
  background: var(--panel);
  border-color: var(--border-2);
  color: var(--text-2);
}
body.theme-dark .instr-toolbar button.ib:hover{
  background: var(--panel-2);
  color: var(--primary);
  border-color: var(--primary);
}
body.theme-dark .instr-toolbar button.ib.active{
  background: var(--primary-soft);
  border-color: var(--primary);
  color: #fff;
}
body.theme-dark .instr-toolbar select{
  background: var(--panel);
  color: var(--text);
  border-color: var(--border-2);
}
body.theme-dark .instr-title-input{ color: var(--text); }
body.theme-dark .instr-content{ color: var(--text); }
body.theme-dark .instr-content table td{ border-color: var(--border-2); }
body.theme-dark .instr-meta{
  background: var(--panel-2);
  border-top-color: var(--border);
  color: var(--text-3);
}

/* Конвертер файлов */
body.theme-dark .conv-card{
  background: var(--panel);
  border-color: var(--border);
}
body.theme-dark .conv-card h3{ color: var(--text); }
body.theme-dark .conv-card .subtitle{ color: var(--text-2); }
body.theme-dark .conv-file-item{
  background: var(--panel-2);
  border-color: var(--border);
  color: var(--text);
}
body.theme-dark .conv-file-item .fsize{ color: var(--text-3); }
body.theme-dark .conv-progress{
  background: #1e3a8a;
  color: #bfdbfe;
}
body.theme-dark .conv-progress .bar{
  background: rgba(147,197,253,.25);
}
body.theme-dark .conv-progress .bar > div{ background: #60a5fa; }

/* Форма организации / работы / материала */
body.theme-dark .org-form-grid label{ color: var(--text-2); }
body.theme-dark .org-form-grid input,
body.theme-dark .org-form-grid textarea{
  background: var(--panel-2);
  color: var(--text);
  border-color: var(--border-2);
}

/* Сайдбар (конструктор шаблона) */
body.theme-dark .sec h3{ color: var(--text-3); }
body.theme-dark .field > span{ color: var(--text-2); }
body.theme-dark .hint{ color: var(--text-3); }

/* Таблица горячих клавиш — фон строк */
body.theme-dark .conv-card [style*="background:#fff"],
body.theme-dark .conv-card [style*="background: #fff"],
body.theme-dark [style*="background:var(--panel-2)"][style*="border:1px solid var(--border)"]{
  background: var(--panel-2) !important;
  border-color: var(--border) !important;
}

/* Прайс-лист — оставляем белым (это документ для печати) */
body.theme-dark .a4,
body.theme-dark .a4.plain{
  background: #fff;
  color: #000;
}
body.theme-dark .a4 table th,
body.theme-dark .a4 table td{
  color: #000;
}

/* Модальные окна — заголовки и подписи */
body.theme-dark .modal h3{ color: var(--text); }
body.theme-dark .modal p{ color: var(--text-2); }
body.theme-dark .modal label{ color: var(--text-2); }
body.theme-dark .modal{ background:var(--panel); color:var(--text); }
body.theme-dark .modal p,
body.theme-dark .modal label,
body.theme-dark .modal .hint{ color:var(--text-2); }
body.theme-dark .modal .modal-actions button{
  background: var(--panel-2); color: var(--text); border-color: var(--border-2);
}

body.theme-dark .conv-card [style*="background:#fff"]{
  background: var(--panel-2) !important;
}

body.theme-dark .modal .modal-actions button:hover{ color: var(--primary); border-color: var(--primary); }
body.theme-dark .modal .modal-actions button.primary{ background: var(--primary); color:#fff; }
body.theme-dark .modal .modal-actions button.danger{ background: var(--danger); color:#fff; }
body.theme-dark input,
body.theme-dark textarea,
body.theme-dark select{
  background: var(--panel); color: var(--text); border-color: var(--border-2);
}
body.theme-dark .custom-select-dropdown{
  background: var(--panel); border-color: var(--border-2); color: var(--text);
}
body.theme-dark .custom-select-option{ color: var(--text); }
body.theme-dark .custom-select-option:hover{ background: var(--primary-soft); }
body.theme-dark .custom-select-option.selected{ background: var(--primary); color:#fff; }
body.theme-dark .list-wrap.print-visible,
body.theme-dark .a4{ background:#fff; color:#000; }
body.theme-dark .a4.plain{ color:#000; }
body.theme-dark .conv-result-item{ background: #064e3b; border-color: #065f46; color: #d1fae5; }
body.theme-dark .conv-result-item .result-name-input{ color: #d1fae5; }
body.theme-dark .conv-result-item .dl{ background: var(--primary); }
body.theme-dark .toast{ box-shadow: 0 8px 24px rgba(0,0,0,.6); }

/* ============================================================
   ПЕЧАТЬ ПРАЙСА — финальные правила
   ============================================================ */
@media print{
  /* Внешний .list-wrap вкладки «Печать прайса» — показываем */
  .list-wrap.refs-print-outer{
    display: block !important;
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  /* Внутри него скрываем заголовок раздела и подвкладки */
  .list-wrap.refs-print-outer > .list-head,
  .list-wrap.refs-print-outer > .subtabs{
    display: none !important;
  }
  /* Контейнер #refs-body — показываем */
  #refs-body{
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  /* Сам прайс — растягиваем на всю ширину листа */
  #refs-print-wrap{
    display: block !important;
    position: static !important;
    width: 100% !important;
    max-width: 100% !important;
    padding: 8mm !important;
    margin: 0 !important;
    background: #fff !important;
    box-shadow: none !important;
    box-sizing: border-box !important;
  }
  /* Внутри прайса — скрываем фильтры и заголовок */
  #refs-print-wrap .filter-bar,
  #refs-print-wrap .list-head{
    display: none !important;
  }
  /* Лист A4 внутри прайса — на всю область */
  #refs-print-wrap .a4{
    width: 100% !important;
    max-width: 100% !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    background: #fff !important;
  }
  /* Таблица — разрывы между строками, шапка повторяется */
  #refs-print-wrap table{
    break-inside: auto !important;
    page-break-inside: auto !important;
    width: 100% !important;
  }
  #refs-print-wrap thead{
    display: table-header-group !important;
  }
  #refs-print-wrap tbody tr{
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }
  .hotkeys-tbl{
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}
body.theme-dark .hotkeys-tbl{
  background: var(--panel-2);
}

<script>
/* ============================================================

/* ============================================================
   INDEXEDDB — радикальное хранилище вместо localStorage
   ============================================================ */
const IDB_NAME  = 'avtocom_db';
const IDB_STORE = 'kv';
const IDB_VER   = 1;
let _idb = null;

function openIDB(){
  return new Promise((resolve, reject) => {
    if (_idb) return resolve(_idb);
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB не поддерживается'));
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => {
      _idb = req.result;
      /* Просим браузер не удалять данные */
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(_){}
      resolve(_idb);
    };
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key){
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  }));
}
function idbSet(key, value){
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  }));
}
function idbDel(key){
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).delete(key);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  }));
}

/* Узнать, какая доля IDB использована (для инфо) */
async function idbInfo(){
  try {
    if (navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      return { usage: e.usage || 0, quota: e.quota || 0 };
    }
  } catch(_){}
  return null;
}

/* Какие ключи храним в IndexedDB (остальные — в localStorage) */
const IDB_KEYS = new Set([
  'zakaz_naryad_db_v1',
  'zakaz_naryad_db_v2',
  'zakaz_naryad_draft_v1',
  'zakaz_naryad_draft_v2'
]);

/* Асинхронная загрузка: сначала из IDB, при отсутствии — из LS (миграция) */
async function loadJSON_async(key, fb){
  if (IDB_KEYS.has(key)){
    try {
      const v = await idbGet(key);
      if (v !== undefined && v !== null) return v;
      /* Одноразовая миграция из localStorage */
      const ls = localStorage.getItem(key);
      if (ls){
        const parsed = JSON.parse(ls);
        await idbSet(key, parsed);
        try { localStorage.removeItem(key); } catch(_){}
        console.log('[IDB] Мигрировано из localStorage:', key);
        return parsed;
      }
      return fb;
    } catch (e){
      console.warn('[IDB] fallback to localStorage:', e.message);
      try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fb; }
      catch(_){ return fb; }
    }
  }
  /* Мелкие ключи остаются в LS */
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fb; }
  catch(e){ return fb; }
}

/* Синхронная версия (для мелких ключей) */
function loadJSON(key,fb){
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fb; }
  catch(e){ return fb; }
}

/* Сохранение: большие ключи → IDB, мелкие → LS */
function saveJSON(key, val){
  if (IDB_KEYS.has(key)){
    /* Fire-and-forget, ошибка → тост */
    idbSet(key, val).catch(e => {
      console.warn('[IDB] save failed:', e);
      toast('Ошибка сохранения в браузере: ' + e.message, 'error');
    });
    return;
  }
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ toast('Не удалось сохранить — переполнение хранилища.', 'error'); }
}

const APP_VERSION    = '1.0.0';
const APP_BUILD_DATE = '2026-10-07';

/* ============================================================
   ПРОВЕРКА ОБНОВЛЕНИЙ
   ============================================================ */
async function checkForUpdates(opts){
  opts = opts || {};
  const silent = !!opts.silent;              // без тоста «проверяю»
  const url = (userSettings.updateUrl || '').trim();
  if (!url){
    if (!silent) toast('Укажите URL файла version.json в настройках','error');
    return null;
  }

  if (!silent) toast('Проверяю обновления…','info');

  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    userSettings.lastUpdateCheck = Date.now();
    saveUserSettings();

    const remoteVer = String(data.version || '0').trim();
    const currentVer = String(APP_VERSION || '0').trim();

    const cmp = compareVersions(remoteVer, currentVer);
    if (cmp > 0){
      /* Есть новая версия */
      if (userSettings.skippedVersion === remoteVer && silent){
        return { status: 'skipped', version: remoteVer, data };
      }
      showUpdateBanner(remoteVer, data);
      return { status: 'available', version: remoteVer, data };
    } else if (cmp === 0){
      if (!silent) toast('У вас актуальная версия ' + currentVer, 'success');
      return { status: 'current', version: currentVer };
    } else {
      if (!silent) toast('У вас версия новее опубликованной (' + currentVer + ')','info');
      return { status: 'ahead', version: currentVer };
    }
  } catch (e){
    if (!silent) toast('Ошибка проверки: ' + e.message,'error');
    console.warn('[update] check failed:', e);
    return null;
  }
}

/* Сравнение версий вида 1.0.0 / 1.0.1 / 2.3.15 */
function compareVersions(a, b){
  const pa = String(a).split('.').map(n => parseInt(n,10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n,10) || 0);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++){
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

/* Баннер о новой версии */
function showUpdateBanner(version, data){
  /* Если баннер уже показан — не дублируем */
  if (document.getElementById('update-banner')) return;

  const bar = document.createElement('div');
  bar.id = 'update-banner';
  bar.style.cssText =
    'position:fixed;left:0;right:0;top:0;z-index:99998;' +
    'background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;' +
    'padding:10px 16px;font-size:13.5px;font-weight:500;' +
    'display:flex;align-items:center;gap:14px;flex-wrap:wrap;' +
    'box-shadow:0 4px 16px rgba(37,99,235,.35);';

  const msg = document.createElement('span');
  msg.style.flex = '1';
  msg.innerHTML = '🎉 <b>Доступна новая версия ' + escapeHtml(version) + '</b>' +
    (data && data.notes ? ' — ' + escapeHtml(data.notes) : '');

  const btnGo = document.createElement('a');
  btnGo.href = (data && data.url) || '#';
  btnGo.target = '_blank';
  btnGo.rel = 'noopener';
  btnGo.textContent = '📥 Скачать';
  btnGo.style.cssText =
    'background:#fff;color:#1d4ed8;padding:6px 14px;border-radius:6px;' +
    'text-decoration:none;font-weight:700;font-size:13px;';
  if (!data || !data.url){
    btnGo.onclick = (e) => { e.preventDefault(); toast('В version.json не указан url для скачивания','error'); };
  }

  const btnLater = document.createElement('button');
  btnLater.textContent = 'Позже';
  btnLater.style.cssText =
    'background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;' +
    'padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;' +
    'font-size:13px;font-weight:600;';
  btnLater.onclick = () => {
    userSettings.skippedVersion = version;
    saveUserSettings();
    bar.remove();
    document.querySelector('header').style.marginTop = '';
  };

  const btnClose = document.createElement('button');
  btnClose.textContent = '×';
  btnClose.style.cssText =
    'background:transparent;border:none;color:#fff;font-size:20px;' +
    'cursor:pointer;padding:0 4px;line-height:1;';
  btnClose.title = 'Закрыть';
  btnClose.onclick = () => {
    bar.remove();
    document.querySelector('header').style.marginTop = '';
  };

  bar.append(msg, btnGo, btnLater, btnClose);
  document.body.appendChild(bar);

  /* Сдвигаем шапку вниз, чтобы баннер не перекрывал кнопки */
  const h = bar.offsetHeight;
  document.querySelector('header').style.marginTop = h + 'px';
}

function applyTheme(){
  if (!document.body) return;
  const t = userSettings.theme || 'light';
  document.body.classList.remove('theme-light','theme-dark');
  if (t === 'auto'){
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.classList.add(prefersDark ? 'theme-dark' : 'theme-light');
  } else {
    document.body.classList.add('theme-' + t);
  }
}
function applyAccent(){
  const accents = {
    blue:   { primary:'#2563eb', hover:'#1d4ed8', soft:'#dbeafe' },
    green:  { primary:'#059669', hover:'#047857', soft:'#d1fae5' },
    orange: { primary:'#ea580c', hover:'#c2410c', soft:'#ffedd5' },
    purple: { primary:'#7c3aed', hover:'#6d28d9', soft:'#ede9fe' }
  };
  const a = accents[userSettings.accent] || accents.blue;
  const r = document.documentElement;
  r.style.setProperty('--primary',        a.primary);
  r.style.setProperty('--primary-hover',  a.hover);
  r.style.setProperty('--primary-soft',   a.soft);
}
function applyUserSettings(){
  applyTheme();
  applyAccent();
}
if (window.matchMedia){

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {

const clone = o=>JSON.parse(JSON.stringify(o));

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function columnLetter(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtNumber(n,d=2){ return isFinite(n)?(+n).toFixed(d):'—'; }
function fmtInt(n){ return isFinite(n)?Math.round(n).toLocaleString('ru-RU'):'—'; }
function slug(s){ return String(s||'file').toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,60)||'file'; }
function uniq(arr){ return [...new Set(arr)]; }

/* === ОПЦИИ СПИСКА: '|' → перенос строки, '\n' внутри — тоже разбиваем === */
/* При вводе: '\n' — разделитель между опциями. '|' остаётся как маркер переноса. */
/* При отображении: '|' превращается в <br>. */
function renderOptionHtml(str){
  return String(str == null ? '' : str)
    .split('|')
    .map(part => escapeHtml(part.trim()))
    .filter(part => part !== '')
    .join('<br>');
}
function renderOptionPlain(str){
  return String(str == null ? '' : str).replace(/\|/g, ' ');
}

function toast(msg,type){
  const host = $('#toastHost'); if(!host) return;
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  const ico = document.createElement('span'); ico.className='ico';
  ico.textContent = type==='success'?'✓':type==='error'?'⚠':'ℹ';
  el.appendChild(ico);
  const t = document.createElement('span'); t.textContent = msg; el.appendChild(t);
  host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); },3200);
}
function downloadJSON(obj,filename){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function pickJSONFile(cb){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{ try{ cb(JSON.parse(reader.result),f); }catch(e){ toast('Ошибка чтения: '+e.message,'error'); } };
    reader.readAsText(f);
  };
  inp.click();
}
function compressImage(file,maxDim=1600,quality=.85){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.naturalWidth,h=img.naturalHeight;
        if (w>maxDim||h>maxDim){
          if (w>h){ h=Math.round(h*maxDim/w); w=maxDim; }
          else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg',quality)); }catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   КАСТОМНЫЙ ВЫПАДАЮЩИЙ СПИСОК
   ============================================================ */

/* Закрыть все открытые списки */
function closeAllDropdowns(){
  document.querySelectorAll('.custom-select-dropdown').forEach(el => el.remove());
}

/* Открыть список под указанным якорем.
   items: [{ value, label, empty }]
   onPick: (value, label) => void */
function openCustomDropdown(anchorEl, items, currentValue, onPick){
  closeAllDropdowns();

  /* --- Формируем список --- */
  const list = document.createElement('div');
  list.className = 'custom-select-dropdown';

  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'custom-select-option' + (it.empty ? ' empty-option' : '');
    if (!it.empty && it.value === currentValue) el.classList.add('selected');
    /* '|' в значении → перенос строки */
    el.innerHTML = renderOptionHtml(it.label);
    el.onmousedown = e => { e.preventDefault(); e.stopPropagation(); };
    el.onclick = e => {
      e.stopPropagation();
      closeAllDropdowns();
      onPick(it.value, it.label);
    };
    list.appendChild(el);
  });

  document.body.appendChild(list);

  /* --- Не даём колесу и тач-жестам уходить на страницу --- */
  list.addEventListener('wheel',       e => e.stopPropagation(), { passive: true });
  list.addEventListener('touchstart',  e => e.stopPropagation(), { passive: true });
  list.addEventListener('touchmove',   e => e.stopPropagation(), { passive: true });

  /* --- Позиционирование --- */
  const rect = anchorEl.getBoundingClientRect();
  const listW = Math.max(rect.width, 180);
  list.style.width = listW + 'px';
  list.style.left = Math.min(rect.left, window.innerWidth - listW - 8) + 'px';

  const vh = window.innerHeight;
  const spaceBelow = vh - rect.bottom;
  const spaceAbove = rect.top;
  const preferredMax = Math.min(vh * 0.6, 400);   /* не больше 60vh и не больше 400px */

  if (spaceBelow < 180 && spaceAbove > spaceBelow){
    /* Открываем ВВЕРХ */
    list.style.top = 'auto';
    list.style.bottom = (vh - rect.top + 2) + 'px';
    list.style.maxHeight = Math.max(140, Math.min(preferredMax, spaceAbove - 12)) + 'px';
  } else {
    /* Открываем ВНИЗ */
    list.style.top = (rect.bottom + 2) + 'px';
    list.style.maxHeight = Math.max(140, Math.min(preferredMax, spaceBelow - 12)) + 'px';
  }
}

/* --- Глобальные слушатели закрытия --- */

/* Клик вне — закрыть */
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.custom-select-dropdown')) closeAllDropdowns();
});

/* Esc — закрыть */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllDropdowns();
}, true);

/* Прокрутка СТРАНИЦЫ — закрыть; прокрутка ВНУТРИ списка — не трогаем */
document.addEventListener('scroll', e => {
  const t = e.target;
  if (t && t.nodeType === 1 && t.closest && t.closest('.custom-select-dropdown')) return;
  closeAllDropdowns();
}, true);

/* ============================================================
   ЕДИНИЦЫ
   ============================================================ */
const UNIT_KEY = 'zakaz_naryad_unit_v1';
const PX_PER_CM = 96/2.54, PX_PER_MM = 96/25.4;
let unit = loadJSON(UNIT_KEY,'px');
if (!['px','cm','mm'].includes(unit)) unit='px';
function pxToUnit(px){ return unit==='cm'?px/PX_PER_CM:unit==='mm'?px/PX_PER_MM:px; }
function unitToPx(v){ return unit==='cm'?v*PX_PER_CM:unit==='mm'?v*PX_PER_MM:v; }
function roundUnitFromPx(px){ const v=pxToUnit(px); return unit==='px'?Math.round(v):unit==='cm'?Math.round(v*100)/100:Math.round(v*10)/10; }
function unitSymbol(){ return unit==='cm'?'см':unit==='mm'?'мм':'px'; }
function formatSize(px){
  if (unit==='cm') return (px/PX_PER_CM).toFixed(2)+' см';
  if (unit==='mm') return (px/PX_PER_MM).toFixed(1)+' мм';
  return Math.round(px)+' px';
}

   МОДЕЛЬ СПРАВОЧНИКОВ: РАБОТЫ И МАТЕРИАЛЫ

function defaultRefItem(kind){
  return {
    id: uid(),
    kind: kind,
    name: '',
    article: '',
    unit: kind === 'work' ? 'н/ч' : 'шт',
    description: '',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    vatRate: 22,
    defaultPriceWithVat: 0,
    defaultPriceWithoutVat: 0,
    pricesByOrg: {}
  };
}
function normalizeRefItem(it, kind){
  if (!it || typeof it !== 'object') return it;
  if (!it.kind) it.kind = kind || 'work';
  if (!it.article) it.article = '';
  if (typeof it.vatRate !== 'number' || !isFinite(it.vatRate) || it.vatRate <= 0) it.vatRate = 22;
  if (typeof it.defaultPriceWithVat !== 'number') it.defaultPriceWithVat = Number(it.defaultPriceWithVat) || 0;
  if (typeof it.defaultPriceWithoutVat !== 'number') it.defaultPriceWithoutVat = Number(it.defaultPriceWithoutVat) || 0;
  if (!it.pricesByOrg || typeof it.pricesByOrg !== 'object') it.pricesByOrg = {};
  for (const orgId in it.pricesByOrg){
    const p = it.pricesByOrg[orgId];
    if (!p || typeof p !== 'object'){ delete it.pricesByOrg[orgId]; continue; }
    p.withVat    = Number(p.withVat)    || 0;
    p.withoutVat = Number(p.withoutVat) || 0;
  }
  return it;
}
function getItemPrice(item, orgId, withVat){
  const key = withVat ? 'withVat' : 'withoutVat';
  const defKey = withVat ? 'defaultPriceWithVat' : 'defaultPriceWithoutVat';
  if (orgId && item.pricesByOrg && item.pricesByOrg[orgId]){
    const p = item.pricesByOrg[orgId];
    if (typeof p[key] === 'number' && p[key] > 0) return p[key];
  }
  return Number(item[defKey]) || 0;
}

/* ============================================================
   ПЕРЕСЧЁТ ЦЕН С НДС / БЕЗ НДС
   ============================================================ */
const _RUB = 2;   // округление до копеек

function roundRub(n){
  const k = Math.pow(10, _RUB);
  return Math.round((Number(n) || 0) * k) / k;
}
function parseMoney(s){
  if (s == null) return 0;
  const v = parseFloat(String(s).replace(',', '.'));
  return isFinite(v) ? v : 0;
}
/* Из цены с НДС получить цену без НДС */
function priceWithoutFromWithout(withVat, vatRate){
  const v = Number(withVat) || 0;
  const rate = Number(vatRate) || 0;
  if (rate <= 0) return roundRub(v);
  return roundRub(v / (1 + rate / 100));
}
/* Из цены без НДС получить цену с НДС */
function priceWithFromWithout(withoutVat, vatRate){
  const v = Number(withoutVat) || 0;
  const rate = Number(vatRate) || 0;
  return roundRub(v * (1 + rate / 100));
}
/* Обновление цены с НДС → пересчёт без НДС */
function updateFromWith(wvInp, wovInp, o){
  const v = parseMoney(wvInp.value);
  o.defaultPriceWithVat = v;
  o.defaultPriceWithoutVat = priceWithoutFromWithout(v, o.vatRate);
  wovInp.value = (o.defaultPriceWithoutVat || o.defaultPriceWithoutVat === 0)
    ? o.defaultPriceWithoutVat
    : '';
}
/* Обновление цены без НДС → пересчёт с НДС */
function updateFromWithout(wvInp, wovInp, o){
  const v = parseMoney(wovInp.value);
  o.defaultPriceWithoutVat = v;
  o.defaultPriceWithVat = priceWithFromWithout(v, o.vatRate);
  wvInp.value = (o.defaultPriceWithVat || o.defaultPriceWithVat === 0)
    ? o.defaultPriceWithVat
    : '';
}
/* ============================================================
   ХЕЛПЕРЫ ДЛЯ ЯЧЕЕК-ССЫЛОК НА КОММЕРЦИЮ
   ============================================================ */
/* Обычная ячейка: пусто при 0 (чтобы не было прочерков в шаблоне) */
function formatMoney(n){
  if (!isFinite(n) || !n) return '';
  return Number(n).toLocaleString('ru-RU', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  }) + ' ₽';
}

/* Итоговая ячейка: всегда показывает число, даже 0,00 ₽ */
function formatMoneyTotal(n){
  const v = isFinite(n) ? Number(n) : 0;
  return v.toLocaleString('ru-RU', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  }) + ' ₽';
}

/* Число из ячейки (из cell.value) */
function cellNum(cell){
  if (!cell) return 0;
  const n = parseFloat(String(cell.value || '').replace(',', '.'));
  return isFinite(n) ? n : 0;
}

/* Найти ячейку заданного типа в строке r (слева направо) */
function findCellInRowByType(tpl, r, type){
  for (let c = 0; c < tpl.cols.length; c++){
    const cell = tpl.cells[r + ':' + c];
    if (cell && !cell.hidden && cell.type === type) return { r, c, cell };
  }
  return null;
}

/* Проверить, помечен ли материал как гарантийный (по примечанию) */
function isWarrantyNote(note){
  return /гарант/i.test(String(note || ''));
}

function defaultRoute(name){

    /* steps: [{ id, title, type:'instruction'|'text', instructionId, content,
                 next: [{ id, label, targetStepId }] }] */
    steps: []
  };
}
function normalizeRoute(r){
  if (!r || typeof r !== 'object') return r;
  if (!Array.isArray(r.tags)) r.tags = [];
  if (!Array.isArray(r.steps)) r.steps = [];
  r.steps.forEach(s => {
    if (!s.id) s.id = uid();
    if (!Array.isArray(s.next)) s.next = [];
    s.next.forEach(n => { if (!n.id) n.id = uid(); });
    if (!s.type) s.type = 'instruction';
  });
  return r;
}
function getRouteStep(route, stepId){
  if (!route || !stepId) return null;
  return route.steps.find(s => s.id === stepId) || null;
}

const BORDER_STYLES = {
  none:   'none',
  thin:   '1px solid #000',
  medium: '2px solid #000',
  thick:  '3px solid #000',
  dashed: '1px dashed #000',
  dotted: '1px dotted #000',
  double: '3px double #000'
};
const BORDER_STYLE_LABELS = [
  ['thin','Тонкая сплошная'],
  ['medium','Средняя сплошная'],
  ['thick','Жирная сплошная'],
  ['dashed','Пунктирная'],
  ['dotted','Точками'],
  ['double','Двойная'],
  ['none','Без границы']
];
function borderCss(style){
  return BORDER_STYLES[style] || BORDER_STYLES.none;
}
function normalizeBorderSide(v){
  if (v === 1) return 'thin';
  if (v === 0) return 'none';
  if (typeof v === 'string' && BORDER_STYLES[v]) return v;
  return 'thin';
}


/* ============================================================
   МОДЕЛЬ
   ============================================================ */
function defaultCell(){
  return {
    html:'', value:'', colspan:1, rowspan:1, hidden:false,
    align:'left', valign:'middle',
    bold:false, italic:false, underline:false,
    fontSize:0, color:'', bg:'',
    borders:{t:'thin',r:'thin',b:'thin',l:'thin'},
    type:'text', options:[], orgField:'name',
    conditionRef:null, conditionText:'', conditionEmptyText:'',
    editable:false,
    refInfo: null,
    userField: 'fullName',
  };
}
function defaultTemplate(name){
  const COLS = 10, ROWS = 51;
  const innerW = 186 * PX_PER_MM;  
  const innerH = 273 * PX_PER_MM;
  const colW = Math.round(innerW / COLS);   
  const rowH = Math.round(innerH / ROWS);   
  return {
    id:uid(), name:name||'Новый документ',
    createdAt:Date.now(), updatedAt:Date.now(),
    cols:Array.from({length:COLS},()=>colW),
    rows:Array.from({length:ROWS},()=>rowH),
    cells:{},
    fontFamily:'Arial, sans-serif', fontSize:10, pagePadding:12,
    tags:[], organization:{name:'',address:''},
    currentOrgId:null
  };
}
function getCell(tpl,r,c){
  const k=r+':'+c;
  let cell=tpl.cells[k];
  if(!cell){ cell=defaultCell(); tpl.cells[k]=cell; }
  if (!cell.borders || typeof cell.borders !== 'object'){
    cell.borders = {t:'thin',r:'thin',b:'thin',l:'thin'};
  }
  cell.borders.t = normalizeBorderSide(cell.borders.t);
  cell.borders.r = normalizeBorderSide(cell.borders.r);
  cell.borders.b = normalizeBorderSide(cell.borders.b);
  cell.borders.l = normalizeBorderSide(cell.borders.l);
  return cell;
}

function pruneCells(tpl){
  if (!tpl || !tpl.cells) return;
  const def = JSON.stringify(defaultCell());
  const out = {};
  for (const k in tpl.cells){
    if (JSON.stringify(tpl.cells[k]) !== def) out[k] = tpl.cells[k];
  }
  tpl.cells = out;
}

/* ============================================================
   УСЛОВИЕ
   ============================================================ */
function parseRefCell(str){
  if (!str) return null;
  const m = String(str).trim().toUpperCase().match(/^([A-Z]+)\s*(\d+)$/);
  if (!m) return null;
  let col = 0;
  for (const ch of m[1]) col = col*26 + (ch.charCodeAt(0) - 64);
  const r = parseInt(m[2],10) - 1, c = col - 1;
  if (r<0 || c<0) return null;
  return { r, c };
}
function refCellToStr(ref){ if (!ref) return ''; return columnLetter(ref.c) + (ref.r + 1); }
function isEmptyCell(cell){
  if (!cell) return true;
  if (cell.type === 'select') return !(cell.value && String(cell.value).trim());
  if (cell.type === 'today')  return false;
  const html = String(cell.html||'')
    .replace(/<br\s*\/?>/gi,' ')
    .replace(/&nbsp;/gi,' ')
    .replace(/<[^>]*>/g,' ')
    .trim();
  return html === '';
}
/* Есть ли в шаблоне хотя бы одна ячейка, помеченная как редактируемая */
function tplHasEditableCells(tpl){
  if (!tpl || !tpl.cells) return false;
  for (const k in tpl.cells){
    const c = tpl.cells[k];
    if (c && c.editable) return true;
  }
  return false;
}

/* Очистить значения: если есть editable-ячейки — только их, иначе — все обычные */
function clearValuesInTemplate(tpl){
  if (!tpl) return;
  const hasEdit = tplHasEditableCells(tpl);
  const what = hasEdit ? 'редактируемые ячейки' : 'ВСЕ ячейки с данными';
  if (!confirm('Очистить содержимое: ' + what + '?\nСтруктура, форматирование и настройки сохранятся.')) return;

  for (const k in tpl.cells){
    const c = tpl.cells[k];
    if (!c) continue;
    if (hasEdit && !c.editable) continue;   // оставляем защищённые
    if (c.type === 'today') continue;        // автодата — не трогаем
    if (c.type === 'condition') continue;    // условия — пересчитаются сами
    if (c.type === 'org-select'){ tpl.currentOrgId = null; continue; }
    if (c.type === 'org-field') continue;    // подтянутся из выбранной организации
    c.html = '';
    c.value = '';
  }
  touch(tpl);
  rerenderSheet();
  refreshSidebar();
  toast('Значения очищены', 'info');
}

/* ============================================================
   ПЕРЕСЧЁТ ВЫЧИСЛИМЫХ ЯЧЕЕК
   ============================================================ */
function refreshComputedCells(tpl){
  if (!tpl) return;
  const table = document.querySelector('.sheet-table');
  if (!table) return;

  /* ---- 1. Собираем данные по строкам ---- */
  const rowData = {};   // { r: { nch, qty, note, workId, matId } }
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (!cell || cell.hidden) continue;
    const [r, c] = k.split(':').map(Number);
    if (!rowData[r]) rowData[r] = { nch: 0, qty: 0, note: '', workId: null, matId: null };
    if (cell.type === 'work-nch') rowData[r].nch   = cellNum(cell);
    if (cell.type === 'mat-qty')  rowData[r].qty   = cellNum(cell);
    if (cell.type === 'mat-note') rowData[r].note  = String(cell.value || '');
    if (cell.type === 'work-pick' && cell.value) rowData[r].workId = cell.value;
    if (cell.type === 'mat-pick'  && cell.value) rowData[r].matId  = cell.value;
  }

  /* ---- 2. Пересчитываем work-price, mat-price, mat-sum ---- */
  let totalWork = 0, totalMat = 0;

  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (!cell || cell.hidden) continue;
    const [r, c] = k.split(':').map(Number);
    const data = rowData[r] || {};

    /* work-price: н/ч × ставка (с НДС) */
    if (cell.type === 'work-price'){
      let price = 0;
      if (data.workId){
        const w = (db.works||[]).find(x => x.id === data.workId);
        if (w){
          const rate = getItemPrice(w, tpl.currentOrgId, true);
          price = rate * (data.nch || 0);
        }
      }
      cell.value = price ? String(price) : '';
      totalWork += price;
    }

    /* mat-price: цена из справочника (с НДС) — ставим в ячейку для отображения */
    if (cell.type === 'mat-price'){
      let price = 0;
      if (data.matId){
        const m = (db.materials||[]).find(x => x.id === data.matId);
        if (m) price = getItemPrice(m, tpl.currentOrgId, true);
      }
      cell.value = price ? String(price) : '';
    }

    /* mat-sum: кол-во × цена, с учётом гарантии */
    if (cell.type === 'mat-sum'){
      let sum = 0;
      const noteStr = String(data.note || '');
      cell.refNote = noteStr;
      if (!isWarrantyNote(noteStr) && data.matId){
        const m = (db.materials||[]).find(x => x.id === data.matId);
        if (m){
          const price = getItemPrice(m, tpl.currentOrgId, true);
          sum = price * (data.qty || 0);
        }
      }
      cell.value = sum ? String(sum) : '';
      if (!isWarrantyNote(noteStr)) totalMat += sum;
    }
  }

  /* ---- 3. Итоговые ячейки ---- */
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (!cell || cell.hidden) continue;
    let val = null;
    if (cell.type === 'total-work') val = totalWork;
    if (cell.type === 'total-mat')  val = totalMat;
    if (cell.type === 'total-all')  val = totalWork + totalMat;
    if (val !== null){
      cell.value = String(val || 0);
    }
  }

  /* ---- 4. Обновляем DOM ---- */
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (!cell || cell.hidden) continue;
    const [r, c] = k.split(':').map(Number);
    const td = table.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
    if (!td) continue;
    const div = td.querySelector('.cell-inner');
    if (!div) continue;

    if (cell.type === 'work-price' || cell.type === 'mat-price' || cell.type === 'mat-sum'){
      const n = parseFloat(cell.value) || 0;
      if (cell.type === 'mat-sum' && isWarrantyNote(cell.refNote)){
        div.textContent = 'по гарантии';
        div.style.color = '#059669';
        div.style.fontStyle = 'italic';
      } else {
        div.textContent = formatMoney(n);   /* пусто при 0 */
        div.style.color = '';
        div.style.fontStyle = '';
      }
    }
    if (cell.type === 'total-work' || cell.type === 'total-mat' || cell.type === 'total-all'){
      div.textContent = formatMoneyTotal(parseFloat(cell.value) || 0);
    }
  }
}

function refreshConditionCells(tpl){
  if (!tpl) return;
  const table = document.querySelector('.sheet-table');
  if (!table) return;
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (cell.type !== 'condition') continue;
    const [r,c] = k.split(':').map(Number);
    const td = table.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
    if (!td) continue;
    const div = td.querySelector('.cell-inner');
    if (!div) continue;
    const refCell = cell.conditionRef ? tpl.cells[cell.conditionRef.r + ':' + cell.conditionRef.c] : null;
    const refEmpty = !refCell || isEmptyCell(refCell);
    div.textContent = refEmpty ? (cell.conditionEmptyText||'') : (cell.conditionText||'');
  }
}

const DB_KEY='zakaz_naryad_db_v1', DB_KEY_V2='zakaz_naryad_db_v2';
const DRAFT_KEY='zakaz_naryad_draft_v1', DRAFT_KEY_V2='zakaz_naryad_draft_v2';
function mergeArrays(a,b){
  const out=[], seen=new Set();
  [a,b].forEach(arr=>{ if(!Array.isArray(arr)) return;
    arr.forEach(it=>{ if(!it||typeof it!=='object') return; const id=it.id; if(id&&seen.has(id)) return; if(id) seen.add(id); out.push(it); });
  });
  return out;
}
function normalizeTemplate(t){
  if (!t || typeof t !== 'object') return t;

  if (!Array.isArray(t.tags)) t.tags = [];
  if (!t.organization || typeof t.organization !== 'object') {
    t.organization = { name: '', address: '' };
  }
  if (t.currentOrgId === undefined) t.currentOrgId = null;
  if (t.cells && typeof t.cells === 'object'){
    for (const k in t.cells){
      const c = t.cells[k];
      if (!c || typeof c !== 'object') continue;
      if (c.editable === undefined){
        c.editable = false;
      }
      if (!c.borders || typeof c.borders !== 'object'){
        c.borders = { t: 'thin', r: 'thin', b: 'thin', l: 'thin' };
      } else {
        c.borders.t = normalizeBorderSide(c.borders.t);
        c.borders.r = normalizeBorderSide(c.borders.r);
        c.borders.b = normalizeBorderSide(c.borders.b);
        c.borders.l = normalizeBorderSide(c.borders.l);
      }
    }
  }

  return t;
}
function normalizeDoc(d){ if(!d||typeof d!=='object') return d; if(!Array.isArray(d.tags)) d.tags=[]; return d; }
function normalizeInstr(i){ if(!i||typeof i!=='object') return i; if(!Array.isArray(i.tags)) i.tags=[]; return i; }
function normalizeOrg(o){
  if(!o||typeof o!=='object') return o;
  const base = defaultOrganization();
  for (const k in base) if (!(k in o)) o[k] = base[k];
  return o;
}
async function loadMigratedDB(){
  const v1 = await loadJSON_async(DB_KEY, null) || {};
  const v2 = await loadJSON_async(DB_KEY_V2, null) || {};
  return {
    templates: mergeArrays(v1.templates,v2.templates).map(normalizeTemplate),
    documents: mergeArrays(v1.documents,v2.documents).map(normalizeDoc),
    tireCalcs: mergeArrays(v1.tireCalcs,v2.tireCalcs),
    kwCalcs: mergeArrays(v1.kwCalcs,v2.kwCalcs),
    instructions: mergeArrays(v1.instructions,v2.instructions).map(normalizeInstr),
    organizations: mergeArrays(v1.organizations,v2.organizations).map(normalizeOrg),
    routes: mergeArrays(v1.routes, v2.routes).map(normalizeRoute),
    works:     mergeArrays(v1.works,     v2.works    ).map(x => normalizeRefItem(x, 'work')),
    materials: mergeArrays(v1.materials, v2.materials).map(x => normalizeRefItem(x, 'material'))
  };
}

function scheduleSave(){
  clearTimeout(saveTimer);
  const delay = (userSettings && userSettings.autoSaveDelay) || 400;
  saveTimer = setTimeout(()=>{
    if (activeSection==='docs' && docsView==='editor' && activeTemplateId===null) saveDraft();
    else saveDB();
    /* После каждого изменения — пересчёт меток переноса страниц */
    try { refreshPageMarkers(); } catch(_){}
  }, delay);
}

function refreshPageMarkers(){
  const a4 = document.querySelector('.a4.editable');
  if (!a4) return;
  /* Удаляем старые */
  a4.querySelectorAll('.page-break-marker').forEach(m => m.remove());
  const pageH = 297 * PX_PER_MM;   // 1122.52 px
  const h = a4.getBoundingClientRect().height;
  const pages = Math.max(1, Math.ceil(h / pageH));
  for (let i = 1; i < pages; i++){
    const marker = document.createElement('div');
    marker.className = 'page-break-marker';
    marker.style.top = (pageH * i) + 'px';
    marker.setAttribute('data-label', 'Лист ' + (i + 1) + ' · конец листа ' + i);
    a4.appendChild(marker);
  }
}
function touch(tpl){ tpl.updatedAt = Date.now(); scheduleSave(); }
function saveDB(){
  const payload = {
    templates: db.templates.map(t=>{ const c=clone(t); pruneCells(c); return c; }),

function collectTags(items){
  const set=new Set();
  items.forEach(it=>(it.tags||[]).forEach(t=>set.add(t)));
  return [...set].sort((a,b)=>a.localeCompare(b,'ru'));
}
function filterAndSort(items,filter){
  let arr = items.slice();
  const q = (filter.search||'').trim().toLowerCase();
  if (q) arr = arr.filter(it=>{
    const name=(it.name||'').toLowerCase();
    const tags=(it.tags||[]).join(' ').toLowerCase();
    const org = it.organization ? ((it.organization.name||'')+' '+(it.organization.address||'')).toLowerCase() : '';
    return name.includes(q) || tags.includes(q) || org.includes(q);
  });
  if (filter.tags && filter.tags.length) arr = arr.filter(it=>filter.tags.every(t=>(it.tags||[]).includes(t)));
  const s = filter.sort;
  arr.sort((a,b)=>{
    if (s==='date-desc') return (b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0);
    if (s==='date-asc')  return (a.updatedAt||a.createdAt||0)-(b.updatedAt||b.createdAt||0);
    if (s==='name-asc')  return (a.name||'').localeCompare(b.name||'','ru');
    if (s==='name-desc') return (b.name||'').localeCompare(a.name||'','ru');
    return 0;
  });
  return arr;
}
function renderFilterBar(opts){
  const bar = document.createElement('div'); bar.className='filter-bar';
  const searchInp = document.createElement('input');
  searchInp.type='text'; searchInp.className='filter-search';
  searchInp.placeholder = opts.placeholder||'Поиск по названию, тегам…';
  searchInp.value = opts.search||'';
  let st = null;
  searchInp.addEventListener('input',()=>{ clearTimeout(st); st=setTimeout(()=>opts.onSearch(searchInp.value),200); });
  bar.appendChild(searchInp);
  if (opts.showSort !== false){
    const sortSel = document.createElement('select'); sortSel.className='filter-sort';
    [['date-desc','↓ по дате'],['date-asc','↑ по дате'],['name-asc','А → Я'],['name-desc','Я → А']].forEach(([v,t])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=t;
      if (v===opts.sortValue) o.selected=true;
      sortSel.appendChild(o);
    });
    sortSel.onchange = ()=>opts.onSort(sortSel.value);
    bar.appendChild(sortSel);
  }
  if (opts.allTags && opts.allTags.length){
    const row = document.createElement('div'); row.className='filter-tags';
    const lbl = document.createElement('span'); lbl.className='filter-label'; lbl.textContent='Теги:';
    row.appendChild(lbl);
    opts.allTags.forEach(t=>{
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (opts.activeTags.includes(t)?' active':'');
      chip.textContent = t;
      chip.onclick = ()=>opts.onToggleTag(t);
      row.appendChild(chip);
    });
    if (opts.activeTags.length){
      const clr = document.createElement('button');
      clr.className='filter-clear'; clr.textContent='× сбросить теги';
      clr.onclick = ()=>opts.onToggleTag(null);
      row.appendChild(clr);
    }
    bar.appendChild(row);
  }
  return bar;
}
function renderTagChips(tags){
  if (!tags || !tags.length) return null;
  const wrap = document.createElement('div'); wrap.className='card-tags';
  const palette = ['','b','g','y'];
  tags.forEach((t,i)=>{

function editTagsFor(item,onSave){
  const cur = (item.tags||[]).join(', ');
  const res = prompt('Теги через запятую:\n(например: Заказ-наряд, Приложение, Срочный)',cur);

function clearImgSelection(){
  document.querySelectorAll('img.img-selected').forEach(i=>i.classList.remove('img-selected'));
  selectedImg = null;
}
function selectImg(img){
  clearImgSelection();
  img.classList.add('img-selected');
  selectedImg = img;
}
function makeImagesResizable(scope,onSave){
  if (!scope) return;
  scope.querySelectorAll('img').forEach(img=>{
    if (img.dataset.resizable) return;
    img.dataset.resizable = '1';
    img.addEventListener('mousedown', e=>{
      selectImg(img);
      const rect = img.getBoundingClientRect();
      const inCorner = (rect.right-e.clientX)<20 && (rect.bottom-e.clientY)<20;
      if (!inCorner) return;
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = rect.width;
      const ratio = rect.width/rect.height;
      const onMove = ev=>{
        const dx = ev.clientX-startX;
        const w = Math.max(30,Math.round(startW+dx));
        const h = Math.round(w/ratio);
        img.style.width = w+'px'; img.style.height = h+'px';
      };
      const onUp = ()=>{
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.body.style.userSelect = '';
        onSave && onSave();
      };
      document.body.style.userSelect = 'none';
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    img.addEventListener('dragstart',e=>e.preventDefault());
  });
}
function removeSelectedImage(){
  if (!selectedImg) return false;
  selectedImg.remove();
  selectedImg = null;
  return true;
}
