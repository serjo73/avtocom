   ВЫДЕЛЕНИЕ ЯЧЕЕК
   ============================================================ */
function getSelRect(){
  if (!selection) return null;
  return {
    r1: Math.min(selection.r1,selection.r2), r2: Math.max(selection.r1,selection.r2),
    c1: Math.min(selection.c1,selection.c2), c2: Math.max(selection.c1,selection.c2)
  };
}
function updateSelectionUI(table){
  const rect = getSelRect();
  $$('td',table).forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    const inSel = rect && r>=rect.r1 && r<=rect.r2 && c>=rect.c1 && c<=rect.c2;
    td.classList.toggle('sel',!!inSel);
  });
}
function blurActiveEditable(){
  const a = document.activeElement;
  if (a && a.isContentEditable){ try{ a.blur(); }catch(_){} }
}

function applyCellStyle(td,cell){
  const b = cell.borders || {t:'thin',r:'thin',b:'thin',l:'thin'};
  const bt = normalizeBorderSide(b.t);
  const br = normalizeBorderSide(b.r);
  const bb = normalizeBorderSide(b.b);
  const bl = normalizeBorderSide(b.l);

  td.style.borderTop    = bt === 'none' ? '' : borderCss(bt);
  td.style.borderRight  = br === 'none' ? '' : borderCss(br);
  td.style.borderBottom = bb === 'none' ? '' : borderCss(bb);
  td.style.borderLeft   = bl === 'none' ? '' : borderCss(bl);

  td.style.background = cell.bg || '';
  td.style.color = cell.color || '';
  td.style.fontWeight = cell.bold ? '700' : '';
  td.style.fontStyle = cell.italic ? 'italic' : '';
  td.style.textDecoration = cell.underline ? 'underline' : '';
  td.style.fontSize = cell.fontSize ? cell.fontSize+'px' : '';
}
function styleInner(div, cell, align, valign){
  if (cell.fontSize) div.style.fontSize = cell.fontSize+'px';
  if (cell.color) div.style.color = cell.color;
  if (cell.bold) div.style.fontWeight = '700';
  if (cell.italic) div.style.fontStyle = 'italic';
  if (cell.underline) div.style.textDecoration = 'underline';
  div.style.textAlign = (align != null ? align : cell.align) || 'left';
  div.dataset.valign = (valign != null ? valign : cell.valign) || 'middle';
}
function makeCellInner(td, cell, opts){
  opts = opts || {};
  const div = document.createElement('div');
  div.className = 'cell-inner';
  styleInner(div, cell, opts.align, opts.valign);
  if (cell.type === 'work-price' || cell.type === 'mat-price' || cell.type === 'mat-sum' ||
      cell.type === 'total-work' || cell.type === 'total-mat' || cell.type === 'total-all'){
    div.dataset.computed = '1';
  }

  td.appendChild(div);
  return div;
}

    else div.textContent = '';
  } else {
    div.innerHTML = cell.html || '';
  }

  const isFill = mode === 'fill';
  const tplHasEdit = isFill && tplHasEditableCells(tpl);
  const isEditable = !isFill ? true : (!tplHasEdit || cell.editable);

  if ((mode === 'fill' || mode === 'design') && cell.type !== 'today'){
    if (mode === 'fill'){
      if (isEditable){
        div.contentEditable = 'true';
      } else {
        div.contentEditable = 'false';
        div.classList.add('locked');
        td.classList.add('locked-cell');
      }
    } else {
      div.contentEditable = 'false';
      td.addEventListener('dblclick', () => {
        div.contentEditable = 'true'; div.focus();
        const range = document.createRange();
        range.selectNodeContents(div); range.collapse(false);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
      });
      div.addEventListener('blur', () => { div.contentEditable = 'false'; });
    }
    if (isEditable){
      div.addEventListener('input', ()=>{
        cell.html = div.innerHTML;
        touch(tpl);
        refreshConditionCells(tpl);
        makeImagesResizable(div, ()=>{ cell.html = div.innerHTML; touch(tpl); });
      });
      div.addEventListener('paste', e=>{
        e.preventDefault();
        const text = (e.clipboardData||window.clipboardData).getData('text/plain');
        document.execCommand('insertText',false,text);
      });
    }
  }
  makeImagesResizable(div, ()=>{ cell.html = div.innerHTML; touch(tpl); });

  if (mode === 'design'){
    if (cell.type === 'select'){
      const b = document.createElement('span'); b.className='select-badge'; b.textContent='▾';
      b.title='Ячейка-список'; td.appendChild(b);
    } else if (cell.type === 'today'){
      const b = document.createElement('span'); b.className='select-badge'; b.textContent='📅';
      b.title='Автодата'; td.appendChild(b);
    } else if (cell.type === 'gosnumber'){
      const b = document.createElement('span'); b.className='select-badge'; b.textContent='🚗';
      b.title='Гос. номер (используется как тег при сохранении копии)'; td.appendChild(b);
    } else if (cell.type === 'work-executor'){
      const b = document.createElement('span'); b.className='select-badge'; b.textContent='👤';
      b.title='Исполнитель'; td.appendChild(b);
    } else if (cell.type === 'work-sign'){
      const b = document.createElement('span'); b.className='select-badge'; b.textContent='✍️';
      b.title='Подпись'; td.appendChild(b);
    }
      if (cell.editable){
    const eb = document.createElement('span');
    eb.className = 'edit-badge';
    eb.textContent = '🔓';
    eb.title = 'Редактируется в режиме заполнения';
    td.appendChild(eb);
    td.classList.add('editable-cell');
    }
  }
}
function attachSelectionHandlers(table,tpl){
  table.addEventListener('mousedown', e=>{
    const td = e.target.closest('td'); if (!td) return;
    if (e.target.closest('.custom-select')) return;
    if (e.target.closest('.custom-select-dropdown')) return;
    if (e.target.tagName === 'IMG') return;
    const inner = e.target.closest('.cell-inner');
    if (inner && inner.isContentEditable && inner === document.activeElement) return;
    blurActiveEditable(); e.preventDefault();
    const r=+td.dataset.r, c=+td.dataset.c;
    if (e.shiftKey && selection){
      selection = { r1: selection.r1, c1: selection.c1, r2: r, c2: c };
    } else {
      selection = { r1: r, c1: c, r2: r, c2: c };
    }
    updateSelectionUI(table);
    refreshSidebar();
  });
  updateSelectionUI(table);
}

/* ============================================================
   ТАБЛИЦА / ЛИСТ
   ============================================================ */
function buildTable(tpl,mode){
  const table = document.createElement('table');
  table.className = 'sheet-table';
  table.style.width = tpl.cols.reduce((a,b)=>a+b,0) + 'px';
  const cg = document.createElement('colgroup');
  tpl.cols.forEach(w=>{ const col=document.createElement('col'); col.style.width=w+'px'; cg.appendChild(col); });
  table.appendChild(cg);
  for (let r=0; r<tpl.rows.length; r++){
    const tr = document.createElement('tr');
    tr.style.height = tpl.rows[r] + 'px';
    for (let c=0; c<tpl.cols.length; c++){
      const cell = getCell(tpl,r,c);
      if (cell.hidden) continue;
      const td = document.createElement('td');
      td.dataset.r = r; td.dataset.c = c;
      if (cell.colspan>1) td.colSpan = Math.min(cell.colspan, tpl.cols.length-c);
      if (cell.rowspan>1) td.rowSpan = Math.min(cell.rowspan, tpl.rows.length-r);
      applyCellStyle(td, cell);
      buildCellContent(td, cell, tpl, mode, r, c);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  if (mode === 'design') attachSelectionHandlers(table, tpl);
  return table;
}
function buildSheet(tpl,mode){
  const a4 = document.createElement('div');
  a4.className = 'a4';
  a4.style.fontFamily = tpl.fontFamily || 'Arial, sans-serif';
  a4.style.fontSize = (tpl.fontSize||13) + 'px';
  if (mode === 'readonly'){
    a4.classList.add('plain');
    a4.style.padding = (tpl.pagePadding ?? 12) + 'mm';
    a4.appendChild(buildTable(tpl, mode));
    return a4;
  }
  a4.classList.add('editable');
  const pagePaddingMm = tpl.pagePadding ?? 12;
  const padPx = pagePaddingMm * PX_PER_MM;
  const rowRulerW = Math.min(28, padPx);
  const colRulerH = Math.min(22, padPx);

  const corner = document.createElement('div'); corner.className='ruler-corner';
  corner.style.width = rowRulerW+'px'; corner.style.height = colRulerH+'px';
  a4.appendChild(corner);

  const rulerCols = document.createElement('div'); rulerCols.className='ruler-cols';
  rulerCols.style.left = rowRulerW+'px';
  rulerCols.style.height = colRulerH+'px';
  rulerCols.style.paddingLeft = Math.max(0,padPx-rowRulerW)+'px';
  rulerCols.style.paddingRight = padPx+'px';
  for (let c=0; c<tpl.cols.length; c++){
    const head = document.createElement('div'); head.className='col-head';
    head.dataset.c = c; head.textContent = columnLetter(c);
    head.style.width = tpl.cols[c] + 'px';
    const line = document.createElement('span'); line.className='resizer-line'; head.appendChild(line);
    head.addEventListener('mousedown', e=>{
      const rect = head.getBoundingClientRect();
      const isEdge = e.clientX > rect.right - 6;
      if (!isEdge){ blurActiveEditable(); return; }
      blurActiveEditable(); e.preventDefault(); e.stopPropagation();
      startColResize(e, c, tpl, rulerCols);
    });
    rulerCols.appendChild(head);
  }
  a4.appendChild(rulerCols);

  const rulerRows = document.createElement('div'); rulerRows.className='ruler-rows';
  rulerRows.style.top = colRulerH+'px';
  rulerRows.style.width = rowRulerW+'px';
  rulerRows.style.paddingTop = Math.max(0,padPx-colRulerH)+'px';
  rulerRows.style.paddingBottom = padPx+'px';
  for (let r=0; r<tpl.rows.length; r++){
    const head = document.createElement('div'); head.className='row-head';
    head.dataset.r = r; head.textContent = (r+1);
    head.style.height = tpl.rows[r] + 'px';
    const line = document.createElement('span'); line.className='resizer-line'; head.appendChild(line);
    head.addEventListener('mousedown', e=>{
      const rect = head.getBoundingClientRect();
      const isEdge = e.clientY > rect.bottom - 6;
      if (!isEdge){ blurActiveEditable(); return; }
      blurActiveEditable(); e.preventDefault(); e.stopPropagation();
      startRowResize(e, r, tpl, rulerRows);
    });
    rulerRows.appendChild(head);
  }
  a4.appendChild(rulerRows);

  const content = document.createElement('div'); content.className='sheet-content';
  content.style.padding = padPx+'px';
  const table = buildTable(tpl, mode);
  content.appendChild(table); a4.appendChild(content);

  requestAnimationFrame(()=>{
    const trs = table.querySelectorAll('tr');
    trs.forEach((tr,i)=>{
      const h = Math.round(tr.getBoundingClientRect().height);
      if (rulerRows.children[i]) rulerRows.children[i].style.height = h+'px';
    });
    const firstTr = table.querySelector('tr');
    if (firstTr){
      let ci = 0;
      [...firstTr.children].forEach(td=>{
        const span = td.colSpan || 1;
        if (span === 1 && rulerCols.children[ci]){
          const w = Math.round(td.getBoundingClientRect().width);
          rulerCols.children[ci].style.width = w+'px';
          tpl.cols[ci] = w;
        }
        ci += span;
      });
    }
    /* Метки переноса страниц после отрисовки таблицы */
    refreshPageMarkers();
    /* Пересчёт вычислимых ячеек (work-price, mat-sum, итоги) */
    try { refreshComputedCells(tpl); } catch(_){}
    try { refreshUserFieldCells(); } catch(_){}
  });
  return a4;
}
function makeResizeTip(text){
  const tip = document.createElement('div');
  tip.className='resize-tip'; tip.textContent=text;
  document.body.appendChild(tip); return tip;
}
function contentAvailableWidth(a4){
  const content = a4.querySelector('.sheet-content'); if (!content) return 0;
  const cs = getComputedStyle(content);
  return content.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
}
function startColResize(e,c,tpl,rulerCols){
  const startX = e.clientX, startW = tpl.cols[c];
  const head = rulerCols.children[c];
  const a4 = rulerCols.closest('.a4');
  const table = a4.querySelector('table');
  const colEl = table.querySelectorAll('col')[c];
  const available = contentAvailableWidth(a4);
  const others = tpl.cols.reduce((s,w,i)=>i===c?s:s+w,0);
  const maxW = Math.max(1, available-others);
  head.classList.add('active');
  const tip = makeResizeTip(formatSize(startW));
  tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+14)+'px';
  document.body.classList.add('resizing');
  const onMove = ev=>{
    const dx = ev.clientX - startX;
    let newW = Math.round(startW + dx);
    newW = Math.max(1, Math.min(maxW, newW));
    tpl.cols[c] = newW;
    head.style.width = newW+'px';
    if (colEl) colEl.style.width = newW+'px';
    table.style.width = tpl.cols.reduce((a,b)=>a+b,0)+'px';
    tip.textContent = formatSize(newW);
    tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+14)+'px';
  };
  const onUp = ()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.body.classList.remove('resizing');
    head.classList.remove('active'); tip.remove();
    touch(tpl); refreshSidebar();
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function startRowResize(e,r,tpl,rulerRows){
  const a4 = rulerRows.closest('.a4');
  const table = a4.querySelector('table');
  const tr = table.querySelectorAll('tr')[r]; if (!tr) return;
  const startY = e.clientY;
  const startH = Math.max(1, Math.round(tpl.rows[r] || 34));
  const head = rulerRows.children[r];
  head.classList.add('active');
  const tip = makeResizeTip(formatSize(startH));
  tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+14)+'px';
  document.body.classList.add('resizing','row');
  const onMove = ev=>{
    const dy = ev.clientY - startY;
    const newH = Math.max(1, Math.round(startH + dy));
    tpl.rows[r] = newH;
    head.style.height = newH+'px';
    tr.style.height = newH+'px';
    tip.textContent = formatSize(newH);
    tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+14)+'px';
  };
  const onUp = ()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.body.classList.remove('resizing','row');
    head.classList.remove('active'); tip.remove();
    touch(tpl); refreshSidebar();
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

/* ============================================================
   СТРУКТУРА ЯЧЕЕК
   ============================================================ */
function unmergeAt(tpl,r,c){
  const cell = getCell(tpl,r,c);
  const w = cell.colspan, h = cell.rowspan;
  for (let i=r; i<r+h; i++) for (let j=c; j<c+w; j++){
    const cc = getCell(tpl,i,j); cc.hidden=false; cc.colspan=1; cc.rowspan=1;
  }
}
function collectAnchors(tpl){
  const list=[];
  for (let r=0;r<tpl.rows.length;r++) for (let c=0;c<tpl.cols.length;c++){
    const cell = tpl.cells[r+':'+c];
    if (cell && !cell.hidden && (cell.colspan>1 || cell.rowspan>1)) list.push({r,c,cell});
  }
  return list;
}
function insertRow(at){
  const tpl = getCurrent(); if (!tpl) return;
  collectAnchors(tpl).filter(a=>a.r<at && a.r+a.cell.rowspan>at).forEach(a=>unmergeAt(tpl,a.r,a.c));
  const nc = {};
  for (const k in tpl.cells){
    const [r,c] = k.split(':').map(Number);
    nc[(r>=at?r+1:r)+':'+c] = tpl.cells[k];
  }
  tpl.cells = nc; tpl.rows.splice(at,0,34); touch(tpl);
}
function deleteRows(start,count){
  const tpl = getCurrent(); if (!tpl) return;
  collectAnchors(tpl).filter(a=>a.r+a.cell.rowspan>start && a.r<start+count).forEach(a=>unmergeAt(tpl,a.r,a.c));
  const nc = {};
  for (const k in tpl.cells){
    const [r,c] = k.split(':').map(Number);
    if (r>=start && r<start+count) continue;
    nc[(r>=start+count?r-count:r)+':'+c] = tpl.cells[k];
  }
  tpl.cells = nc; tpl.rows.splice(start,count); touch(tpl);
}
function insertCol(at){
  const tpl = getCurrent(); if (!tpl) return;
  collectAnchors(tpl).filter(a=>a.c<at && a.c+a.cell.colspan>at).forEach(a=>unmergeAt(tpl,a.r,a.c));
  const nc = {};
  for (const k in tpl.cells){
    const [r,c] = k.split(':').map(Number);
    nc[r+':'+(c>=at?c+1:c)] = tpl.cells[k];
  }
  tpl.cells = nc; tpl.cols.splice(at,0,110); touch(tpl);
}
function deleteCols(start,count){
  const tpl = getCurrent(); if (!tpl) return;
  collectAnchors(tpl).filter(a=>a.c+a.cell.colspan>start && a.c<start+count).forEach(a=>unmergeAt(tpl,a.r,a.c));
  const nc = {};
  for (const k in tpl.cells){
    const [r,c] = k.split(':').map(Number);
    if (c>=start && c<start+count) continue;
    nc[r+':'+(c>=start+count?c-count:c)] = tpl.cells[k];
  }
  tpl.cells = nc; tpl.cols.splice(start,count); touch(tpl);
}
function mergeCells(){
  const tpl = getCurrent(); const rect = getSelRect();
  if (!tpl || !rect) return;
  const w = rect.c2-rect.c1+1, h = rect.r2-rect.r1+1;
  if (w<2 && h<2) return;
  const anchors = [];
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    const cell = tpl.cells[r+':'+c];
    if (cell && !cell.hidden && (cell.colspan>1||cell.rowspan>1)) anchors.push([r,c]);
  }
  anchors.forEach(([r,c])=>unmergeAt(tpl,r,c));
  let html = '';
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    const cell = getCell(tpl,r,c);
    if (cell.html && cell.html.replace(/<br\s*\/?>/gi,'').trim()!=='') html += (html?'<br>':'') + cell.html;
  }
  const anchor = getCell(tpl,rect.r1,rect.c1);
  anchor.html = html; anchor.colspan = w; anchor.rowspan = h; anchor.hidden = false;
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    if (r===rect.r1 && c===rect.c1) continue;
    const cell = getCell(tpl,r,c);
    cell.hidden=true; cell.html=''; cell.value=''; cell.colspan=1; cell.rowspan=1;
  }
  touch(tpl); refreshAll();
}
function splitCells(){
  const tpl = getCurrent(); const rect = getSelRect();
  if (!tpl || !rect) return;
  const anchors = [];
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    const cell = tpl.cells[r+':'+c];
    if (cell && !cell.hidden && (cell.colspan>1||cell.rowspan>1)) anchors.push([r,c]);
  }
  anchors.forEach(([r,c])=>unmergeAt(tpl,r,c));
  touch(tpl); refreshAll();
}
function applySel(fn,refreshSb){
  const tpl = getCurrent(); const rect = getSelRect();
  if (!tpl || !rect) return;
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    if (r>=tpl.rows.length || c>=tpl.cols.length) continue;
    const cell = getCell(tpl,r,c);
    if (cell.hidden) continue;
    fn(cell,r,c);
  }
  touch(tpl); rerenderSheet();
  if (refreshSb) refreshSidebar();
}
function setBorders(kind, style){
  style = style || 'thin';
  const tpl = getCurrent(); const rect = getSelRect();
  if (!tpl || !rect) return;
  for (let r=rect.r1;r<=rect.r2;r++) for (let c=rect.c1;c<=rect.c2;c++){
    if (r>=tpl.rows.length || c>=tpl.cols.length) continue;
    const cell = getCell(tpl,r,c); if (cell.hidden) continue;
    const isTop = r===rect.r1, isBottom = r===rect.r2;
    const isLeft = c===rect.c1, isRight = c===rect.c2;

    if (kind === 'all'){
      cell.borders = { t: style, r: style, b: style, l: style };
    } else if (kind === 'none'){
      cell.borders = { t: 'none', r: 'none', b: 'none', l: 'none' };
    } else if (kind === 'outer'){
      if (isTop)    cell.borders.t = style;
      if (isBottom) cell.borders.b = style;
      if (isLeft)   cell.borders.l = style;
      if (isRight)  cell.borders.r = style;
    } else if (kind === 'inner'){
      if (!isTop)    cell.borders.t = style;
      if (!isBottom) cell.borders.b = style;
      if (!isLeft)   cell.borders.l = style;
      if (!isRight)  cell.borders.r = style;
    }
  }
  touch(tpl); refreshAll();
}

function renderMain(){
  const area = $('#sheetArea');
  const sidebar = $('#sidebar');
  area.innerHTML = ''; sidebar.innerHTML = ''; area.classList.remove('tall');
  clearImgSelection();

  if (_CONFIG && !cfgSection(activeSection)){
    const first = ['docs','orgs','tools','reference','routes','settings'].find(cfgSection);
    if (first) activeSection = first;
  }

  if (activeSection === 'docs'){
    if (viewingDoc){ sidebar.classList.add('hidden'); area.classList.add('tall'); renderDocView(area, viewingDoc); return; }
    if (docsView === 'list'){ sidebar.classList.add('hidden'); area.classList.add('tall'); renderDocsList(area); return; }
    const tpl = getCurrent();
    if (!tpl){ area.innerHTML = '<div class="empty-state">Шаблон не найден</div>'; return; }
    area.appendChild(buildSheet(tpl, mode));
    if (mode === 'design'){ sidebar.classList.remove('hidden'); renderSidebar(sidebar, tpl); }
    else sidebar.classList.add('hidden');
    return;
  }
  if (activeSection === 'orgs'){ sidebar.classList.add('hidden'); area.classList.add('tall'); renderReferences(area); return; }
  if (activeSection === 'tools'){ sidebar.classList.add('hidden'); area.classList.add('tall'); renderTools(area); return; }
  if (activeSection === 'reference'){
    sidebar.classList.add('hidden'); area.classList.add('tall');
    if (editingInstruction) renderInstructionEditor(area, editingInstruction);
    else renderReferenceList(area);
    return;
  }
  if (activeSection === 'routes'){
    sidebar.classList.add('hidden'); area.classList.add('tall');
    if (routesView === 'editor' && editingRoute) renderRouteEditor(area, editingRoute);
    else if (routesView === 'runner' && routeRunState) renderRouteRunner(area, routeRunState);
    else renderRoutesList(area);
    return;
  }
  if (activeSection === 'settings'){
  sidebar.classList.add('hidden'); area.classList.add('tall');
  renderSettings(area);
  return;
  }
}

/* --- Хелперы для парсинга цен --- */
function parseMoney(s){
  const v = parseFloat(String(s == null ? '' : s).replace(',', '.'));
  return isFinite(v) ? v : 0;
}
function updateFromWith(wvInp, wovInp, o){
  const v = parseMoney(wvInp.value);
  o.defaultPriceWithVat = v;
  o.defaultPriceWithoutVat = priceWithoutFromWithout(v, o.vatRate);
  wovInp.value = o.defaultPriceWithoutVat ? o.defaultPriceWithoutVat : '';
}
function updateFromWithout(wvInp, wovInp, o){
  const v = parseMoney(wovInp.value);
  o.defaultPriceWithoutVat = v;
  o.defaultPriceWithVat = priceWithFromWithout(v, o.vatRate);
  wvInp.value = o.defaultPriceWithVat ? o.defaultPriceWithVat : '';
}

function editRefItem(kind, item){
  const isWork = kind === 'work';
  const arr = isWork ? db.works : db.materials;
  const isNew = !item;
  const o = item ? clone(item) : defaultRefItem(kind);
  if (!o.pricesByOrg) o.pricesByOrg = {};
  /* Жёсткая защита: ставка всегда число > 0 */
  if (typeof o.vatRate !== 'number' || !isFinite(o.vatRate) || o.vatRate <= 0) o.vatRate = 22;

  const ov = document.createElement('div'); ov.className='modal-overlay';
  const modal = document.createElement('div'); modal.className='modal';
  modal.style.maxWidth = '820px';
  modal.innerHTML = '<h3>' + (isNew ? '➕ ' + (isWork ? 'Новая работа' : 'Новый материал') : '✏️ Редактирование') + '</h3>';

  /* ============================================================
     ОСНОВНЫЕ ПОЛЯ
     ============================================================ */

  nameWrap.innerHTML = '<label>Название *</label>';

  nameInp.placeholder = isWork ? 'Замена масла ДВС' : 'Масло моторное 5W-30';
  nameInp.oninput = () => { o.name = nameInp.value; };
  nameWrap.appendChild(nameInp);
  grid.appendChild(nameWrap);

  const artWrap = document.createElement('div');
  artWrap.innerHTML = '<label>Артикул</label>';
  const artInp = document.createElement('input'); artInp.type='text'; artInp.value = o.article || '';
  artInp.oninput = () => { o.article = artInp.value; };
  artWrap.appendChild(artInp);
  grid.appendChild(artWrap);

  const unitWrap = document.createElement('div');
  unitWrap.innerHTML = '<label>Единица измерения</label>';
  const unitInp = document.createElement('input'); unitInp.type='text'; unitInp.value = o.unit || '';
  unitInp.placeholder = isWork ? 'н/ч' : 'шт / л / кг';
  unitInp.oninput = () => { o.unit = unitInp.value; };
  unitWrap.appendChild(unitInp);
  grid.appendChild(unitWrap);

  const vatWrap = document.createElement('div');
  vatWrap.innerHTML = '<label>Ставка НДС, %</label>';
  const vatInp = document.createElement('input');
  vatInp.type = 'number'; vatInp.min = '1'; vatInp.max = '99'; vatInp.step = '1';
  vatInp.value = o.vatRate;
  vatInp.style.cssText = 'padding:8px 11px;border:1px solid var(--border-2);border-radius:7px;font:inherit;font-size:13.5px;background:#fff;';
  vatInp.oninput = () => {
    const v = parseMoney(vatInp.value);
    o.vatRate = (v > 0 ? v : 22);
    /* Пересчёт без НДС от уже введённой цены с НДС */
    o.defaultPriceWithoutVat = priceWithoutFromWithout(o.defaultPriceWithVat, o.vatRate);
    wovInp.value = o.defaultPriceWithoutVat ? o.defaultPriceWithoutVat : '';
    /* И для организаций */
    for (const orgId in orgPriceInputs){
      const refs = orgPriceInputs[orgId];
      const withVat = parseMoney(refs.inp1.value);
      const without = priceWithoutFromWithout(withVat, o.vatRate);
      refs.inp2.value = without ? without : '';
      if (!o.pricesByOrg[orgId]) o.pricesByOrg[orgId] = { withVat: 0, withoutVat: 0 };
      o.pricesByOrg[orgId].withVat = withVat;
      o.pricesByOrg[orgId].withoutVat = without;
    }
  };
  vatWrap.appendChild(vatInp);
  grid.appendChild(vatWrap);

  const descWrap = document.createElement('div'); descWrap.className = 'full';
  descWrap.innerHTML = '<label>Описание (опционально)</label>';
  const descInp = document.createElement('input'); descInp.type='text'; descInp.value = o.description || '';
  descInp.oninput = () => { o.description = descInp.value; };
  descWrap.appendChild(descInp);
  grid.appendChild(descWrap);
  modal.appendChild(grid);

  /* ============================================================
     БАЗОВЫЕ ЦЕНЫ
     ============================================================ */
  const baseH = document.createElement('h4');
  baseH.style.cssText = 'margin:20px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);';
  baseH.textContent = 'Базовые цены (по умолчанию)';
  modal.appendChild(baseH);

  const priceGrid = document.createElement('div'); priceGrid.className = 'org-form-grid';

  const wvWrap = document.createElement('div');
  wvWrap.innerHTML = '<label>Цена с НДС, ₽</label>';
  const wvInp = document.createElement('input');
  wvInp.type='number'; wvInp.min='0'; wvInp.step='0.01';
  wvInp.value = o.defaultPriceWithVat ? o.defaultPriceWithVat : '';
  wvInp.style.cssText = 'padding:8px 11px;border:1px solid var(--border-2);border-radius:7px;font:inherit;font-size:13.5px;background:#fff;';
  wvInp.addEventListener('input', () => updateFromWith(wvInp, wovInp, o));
  wvWrap.appendChild(wvInp);
  priceGrid.appendChild(wvWrap);

  const wovWrap = document.createElement('div');
  wovWrap.innerHTML = '<label>Цена без НДС, ₽</label>';
  const wovInp = document.createElement('input');
  wovInp.type='number'; wovInp.min='0'; wovInp.step='0.01';
  wovInp.value = o.defaultPriceWithoutVat ? o.defaultPriceWithoutVat : '';
  wovInp.style.cssText = 'padding:8px 11px;border:1px solid var(--border-2);border-radius:7px;font:inherit;font-size:13.5px;background:#fff;';
  wovInp.addEventListener('input', () => updateFromWithout(wvInp, wovInp, o));
  wovWrap.appendChild(wovInp);
  priceGrid.appendChild(wovWrap);
  modal.appendChild(priceGrid);

  const baseHint = document.createElement('div');
  baseHint.className = 'hint';
  baseHint.style.marginTop = '-6px';
  modal.appendChild(baseHint);

  /* ============================================================
     ИНДИВИДУАЛЬНЫЕ ЦЕНЫ ПО ОРГАНИЗАЦИЯМ
     ============================================================ */
  const orgPriceInputs = {};   // { orgId: { inp1, inp2 } }

  if (db.organizations.length){
    const orgH = document.createElement('h4');
    orgH.style.cssText = 'margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);';
    orgH.textContent = 'Индивидуальные цены по организациям';
    modal.appendChild(orgH);

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.style.marginBottom = '10px';
    hint.textContent = 'Если поле пустое — берётся базовая цена. Можно вводить как с НДС, так и без — второе рассчитается само.';
    modal.appendChild(hint);

    const table = document.createElement('div');
    table.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    db.organizations.forEach(org => {
      const p = o.pricesByOrg[org.id] || { withVat: 0, withoutVat: 0 };
      const row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 130px 130px;gap:8px;align-items:center;padding:6px 10px;background:var(--panel-2);border-radius:7px;';
      const orgName = document.createElement('span');
      orgName.style.cssText = 'font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      orgName.textContent = org.name || '(без названия)';

      const inp1 = document.createElement('input');
      inp1.type='number'; inp1.min='0'; inp1.step='0.01'; inp1.placeholder='с НДС';
      inp1.value = p.withVat ? p.withVat : '';
      inp1.style.cssText = 'padding:6px 9px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;';

      const inp2 = document.createElement('input');
      inp2.type='number'; inp2.min='0'; inp2.step='0.01'; inp2.placeholder='без НДС';
      inp2.value = p.withoutVat ? p.withoutVat : '';
      inp2.style.cssText = 'padding:6px 9px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;';

      inp1.addEventListener('input', () => {
        const withVat = parseMoney(inp1.value);
        const without = priceWithoutFromWithout(withVat, o.vatRate);
        inp2.value = without ? without : '';
        if (!o.pricesByOrg[org.id]) o.pricesByOrg[org.id] = { withVat: 0, withoutVat: 0 };
        o.pricesByOrg[org.id].withVat = withVat;
        o.pricesByOrg[org.id].withoutVat = without;
      });
      inp2.addEventListener('input', () => {
        const without = parseMoney(inp2.value);
        const withVat = priceWithFromWithout(without, o.vatRate);
        inp1.value = withVat ? withVat : '';
        if (!o.pricesByOrg[org.id]) o.pricesByOrg[org.id] = { withVat: 0, withoutVat: 0 };
        o.pricesByOrg[org.id].withVat = withVat;
        o.pricesByOrg[org.id].withoutVat = without;
      });

      orgPriceInputs[org.id] = { inp1, inp2 };
      row.append(orgName, inp1, inp2);
      table.appendChild(row);
    });
    modal.appendChild(table);
  }

  /* ============================================================
     ДЕЙСТВИЯ
     ============================================================ */
  const actions = document.createElement('div'); actions.className='modal-actions';
  const cancel = document.createElement('button'); cancel.textContent='Отмена';
  cancel.onclick = () => ov.remove();
  const save = document.createElement('button'); save.className='primary'; save.textContent='💾 Сохранить';
  save.onclick = () => {
    if (!o.name.trim()){ toast('Укажите название','error'); return; }
    o.updatedAt = Date.now();
    for (const orgId in o.pricesByOrg){
      const p = o.pricesByOrg[orgId];
      if (!p.withVat && !p.withoutVat) delete o.pricesByOrg[orgId];
    }
    if (isNew) arr.push(o);
    else {
      const idx = arr.findIndex(x => x.id === o.id);
      if (idx >= 0) arr[idx] = o;
    }
    saveDB();
    ov.remove();
    render();
    toast('Сохранено','success');
  };
  actions.append(cancel, save);
  modal.appendChild(actions);

  ov.appendChild(modal);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  setTimeout(() => nameInp.focus(), 50);
}

    const lbl = document.createElement('label'); lbl.textContent = f.label;
    let inp;

  });

  cancel.onclick = ()=>ov.remove();
  const save = document.createElement('button'); save.className='primary'; save.textContent='💾 Сохранить';
  save.onclick = ()=>{
    if (!o.name.trim()){ toast('Укажите наименование организации','error'); return; }
    o.updatedAt = Date.now();
    if (isNew) db.organizations.push(o);
    else {
      const idx = db.organizations.findIndex(x=>x.id===o.id);
      if (idx >= 0) db.organizations[idx] = o;
    }
    saveDB(); ov.remove(); render();
    toast('Организация сохранена','success');
  };
  actions.append(cancel, save);
  modal.appendChild(actions);
  ov.appendChild(modal);
  document.body.appendChild(ov);
}
function renderRefsOrgs(area){
  area.innerHTML = '';

  head.innerHTML = `<h2>🏢 Организации <span class="count-badge">${db.organizations.length}</span></h2>`;
  const headActions = document.createElement('div'); headActions.className='btn-row';
  const newBtn = document.createElement('button');
  newBtn.className='btn primary'; newBtn.textContent='➕ Новая организация';
  newBtn.onclick = ()=>editOrganization(null);
  headActions.appendChild(newBtn);
  head.appendChild(headActions);
  wrap.appendChild(head);

  if (db.organizations.length){
    const bar = document.createElement('div'); bar.className='filter-bar';
    const s = document.createElement('input');
    s.type='text'; s.className='filter-search';
    s.placeholder='Поиск по названию, ИНН, адресу…';
    s.value = orgFilter.search || '';
    let st = null;
    s.addEventListener('input', ()=>{ clearTimeout(st); st=setTimeout(()=>{ orgFilter.search = s.value; renderOrgs(area); },200); });
    bar.appendChild(s);
    wrap.appendChild(bar);
  }
  const q = (orgFilter.search||'').trim().toLowerCase();
  let list = db.organizations.slice();
  if (q) list = list.filter(o=>{
    const hay = [(o.name||''),(o.shortName||''),(o.address||''),(o.inn||''),(o.ogrn||''),(o.kpp||''),(o.phone||''),(o.email||'')].join(' ').toLowerCase();
    return hay.includes(q);
  });
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru'));
  if (!db.organizations.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.innerHTML = '<span class="big-icon">🏢</span>Пока нет ни одной организации.<br>Нажмите «➕ Новая организация».';
    wrap.appendChild(e);
  } else if (!list.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'Ничего не найдено по текущему поиску.';
    wrap.appendChild(e);
  } else {
    const grid = document.createElement('div'); grid.className='card-grid';
    list.forEach(org=>{
      const card = document.createElement('div'); card.className='item-card';
      const metaLines = [];
      if (org.inn) metaLines.push('ИНН: <b>'+escapeHtml(org.inn)+'</b>');
      if (org.ogrn) metaLines.push('ОГРН: <b>'+escapeHtml(org.ogrn)+'</b>');
      if (org.kpp) metaLines.push('КПП: <b>'+escapeHtml(org.kpp)+'</b>');
      if (org.phone) metaLines.push('Тел: <b>'+escapeHtml(org.phone)+'</b>');
      card.innerHTML = `
        <span class="item-badge org">организация</span>
        <div class="item-title">${escapeHtml(org.name||'(без названия)')}</div>
        <div class="item-meta">
          ${org.address ? escapeHtml(org.address)+'<br>' : ''}
          ${metaLines.join(' · ')}
        </div>`;
      const actions = document.createElement('div'); actions.className='item-actions';
      const edit = document.createElement('button');
      edit.className='card-btn primary'; edit.textContent='✏️ Изменить';
      edit.onclick = e=>{ e.stopPropagation(); editOrganization(org); };
      const copy = document.createElement('button');
      copy.className='card-btn'; copy.textContent='📋 Копия';
      copy.onclick = e=>{
        e.stopPropagation();
        const c = clone(org); c.id = uid(); c.name = org.name+' (копия)';
        c.createdAt = Date.now(); c.updatedAt = Date.now();
        db.organizations.push(c); saveDB(); renderOrgs(area);
        toast('Копия создана','info');
      };
      const del = document.createElement('button');
      del.className='card-btn danger'; del.textContent='🗑';
      del.onclick = e=>{
        e.stopPropagation();
        if (!confirm(`Удалить организацию «${org.name}»?`)) return;
        db.organizations = db.organizations.filter(x=>x.id!==org.id);
        saveDB(); renderOrgs(area);
        toast('Организация удалена','info');
      };
      actions.append(edit, copy, del);
      card.appendChild(actions);
      card.onclick = ()=>editOrganization(org);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }
  area.appendChild(wrap);
}

function renderReferences(area){
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'list-wrap';
  if (refsTab === 'print') wrap.classList.add('refs-print-outer');

  const head = document.createElement('div'); head.className = 'list-head';
  head.innerHTML = '<h2>💼 Коммерция</h2>';
  wrap.appendChild(head);

  /* Подвкладки */
  const subs = document.createElement('div');
  subs.className = 'subtabs';
  subs.style.marginBottom = '18px';
  [
    ['orgs','🏢 Организации'],
    ['works','🔧 Работы'],
    ['materials','📦 Материалы'],
    ['print','🖨 Печать прайса']
  ].forEach(([id, label]) => {
    const el = document.createElement('div');
    el.className = 'subtab' + (refsTab === id ? ' active' : '');
    el.textContent = label;
    el.onclick = () => {
      if (refsTab === id) return;
      refsTab = id;
      render();
    };
    subs.appendChild(el);
  });
  wrap.appendChild(subs);

  const body = document.createElement('div');
  body.id = 'refs-body';
  wrap.appendChild(body);

  area.appendChild(wrap);

  if (refsTab === 'orgs')      renderRefsOrgsInto(body);
  else if (refsTab === 'works')     renderRefsItemsInto(body, 'work');
  else if (refsTab === 'materials') renderRefsItemsInto(body, 'material');
  else                              renderRefsPrintInto(body);
}

function renderRefsOrgsInto(body){
  renderRefsOrgs(body);
}
function renderRefsItemsInto(body, kind){
  renderRefsItems(body, kind);
}

  renderRefsPrint(body);
}

/* Очистка всех данных */
function clearAllData(){
  const confirmText = prompt(
    'ВНИМАНИЕ! Будут удалены ВСЕ данные:\n' +
    '• Шаблоны документов\n' +
    '• Сохранённые копии\n' +
    '• Справочники, маршруты, коммерция\n' +
    '• Организации, расчёты\n\n' +
    'Для подтверждения введите слово УДАЛИТЬ (заглавными):'
  );
  if (confirmText !== 'УДАЛИТЬ') return;
  try {
    /* Очищаем IDB */
    if (_idb){
      const tx = _idb.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).clear();
    } else {
      openIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).clear();
      });
    }
    /* Очищаем localStorage от данных, но оставляем настройки */
    try {
      localStorage.removeItem(DB_KEY);
      localStorage.removeItem(DB_KEY_V2);
      localStorage.removeItem(DRAFT_KEY);
      localStorage.removeItem(DRAFT_KEY_V2);
      localStorage.removeItem(UNIT_KEY);
    } catch(_){}
    setTimeout(() => {
      location.reload();
    }, 500);
  } catch(e){
    toast('Ошибка очистки: ' + e.message, 'error');
  }
}

/* Обновление ячеек-полей профиля на текущем листе */
function refreshUserFieldCells(){
  const tpl = getCurrent();
  if (!tpl) return;
  const table = document.querySelector('.sheet-table');
  if (!table) return;
  for (const k in tpl.cells){
    const cell = tpl.cells[k];
    if (!cell || cell.hidden || cell.type !== 'user-field') continue;
    const [r, c] = k.split(':').map(Number);
    const td = table.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
    if (!td) continue;
    const div = td.querySelector('.cell-inner');
    if (!div) continue;
    div.textContent = userSettings.profile[cell.userField || 'fullName'] || '';
  }
}

/* ============================================================
   СПИСОК РАБОТ / МАТЕРИАЛОВ
   ============================================================ */
function renderRefsItems(area, kind){
  area.innerHTML = '';
  const isWork = kind === 'work';
  const arr = isWork ? db.works : db.materials;
  const wrap = document.createElement('div'); wrap.className='list-wrap';

  const head = document.createElement('div'); head.className='list-head';
  head.innerHTML = '<h2>' + (isWork ? '🔧 Работы' : '📦 Материалы') +
                   ' <span class="count-badge">' + arr.length + '</span></h2>';
  const headActions = document.createElement('div'); headActions.className='btn-row';
  const newBtn = document.createElement('button');
  newBtn.className='btn primary';
  newBtn.textContent = isWork ? '➕ Новая работа' : '➕ Новый материал';
  newBtn.onclick = () => editRefItem(kind, null);
  headActions.appendChild(newBtn);
  head.appendChild(headActions);
  wrap.appendChild(head);

  if (arr.length){
    const bar = document.createElement('div'); bar.className='filter-bar';
    const s = document.createElement('input');
    s.type='text'; s.className='filter-search';
    s.placeholder = 'Поиск по названию, артикулу…';
    s.value = refsItemsFilter.search || '';
    let st = null;
    s.addEventListener('input', () => {
      clearTimeout(st);
      st = setTimeout(() => { refsItemsFilter.search = s.value; renderRefsItems(area, kind); }, 200);
    });
    bar.appendChild(s);

    const sortSel = document.createElement('select'); sortSel.className='filter-sort';
    [['name-asc','А → Я'],['name-desc','Я → А'],['date-desc','↓ по дате'],['date-asc','↑ по дате']].forEach(([v,t])=>{
      const o = document.createElement('option'); o.value=v; o.textContent=t;
      if ((refsItemsFilter.sort||'name-asc') === v) o.selected = true;
      sortSel.appendChild(o);
    });
    sortSel.onchange = () => { refsItemsFilter.sort = sortSel.value; renderRefsItems(area, kind); };
    bar.appendChild(sortSel);
    wrap.appendChild(bar);
  }

  const q = (refsItemsFilter.search || '').trim().toLowerCase();
  let list = arr.slice();
  if (q) list = list.filter(it =>
    (it.name||'').toLowerCase().includes(q) ||
    (it.article||'').toLowerCase().includes(q)
  );
  const s = refsItemsFilter.sort || 'name-asc';
  list.sort((a,b) => {
    if (s === 'name-asc')  return (a.name||'').localeCompare(b.name||'','ru');
    if (s === 'name-desc') return (b.name||'').localeCompare(a.name||'','ru');
    if (s === 'date-desc') return (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
    if (s === 'date-asc')  return (a.updatedAt||a.createdAt||0) - (b.updatedAt||b.createdAt||0);
    return 0;
  });

  if (!arr.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.innerHTML = '<span class="big-icon">' + (isWork ? '🔧' : '📦') + '</span>' +
      'Пока нет ' + (isWork ? 'работ' : 'материалов') + '.<br>' +
      'Нажмите «' + (isWork ? '➕ Новая работа' : '➕ Новый материал') + '», чтобы добавить первый.';
    wrap.appendChild(e);
    area.appendChild(wrap);
    return;
  }
  if (!list.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'Ничего не найдено по текущему фильтру.';
    wrap.appendChild(e);
    area.appendChild(wrap);
    return;
  }

  const grid = document.createElement('div'); grid.className='card-grid';
  list.forEach(it => {
    const card = document.createElement('div'); card.className='item-card';
    const prices = it.pricesByOrg || {};
    const orgsWithPrices = Object.keys(prices).length;

    let previewOrgs = '';
    Object.keys(prices).slice(0, 3).forEach(orgId => {
      const org = db.organizations.find(o => o.id === orgId);
      if (!org) return;
      const p = prices[orgId];
      previewOrgs += '<div style="font-size:11.5px;color:var(--text-3);margin-top:3px;">' +
                     '<b style="color:var(--text-2);font-weight:600;">' + escapeHtml(org.name) + ':</b> ' +
                     (p.withVat ? p.withVat.toLocaleString('ru-RU') + ' ₽ с НДС' : '—') +
                     ' / ' +
                     (p.withoutVat ? p.withoutVat.toLocaleString('ru-RU') + ' ₽ без НДС' : '—') +
                     '</div>';
    });

    card.innerHTML =
      '<span class="item-badge blue">' + (isWork ? 'работа' : 'материал') + '</span>' +
      '<div class="item-title">' + escapeHtml(it.name || '(без названия)') + '</div>' +
      '<div class="item-meta">' +
        (it.article ? 'Артикул: <b>' + escapeHtml(it.article) + '</b><br>' : '') +
        'Ед.: <b>' + escapeHtml(it.unit || '—') + '</b><br>' +
        'Базовая: <b>' + (it.defaultPriceWithVat ? Number(it.defaultPriceWithVat).toLocaleString('ru-RU') + ' ₽ с НДС' : '—') + '</b>' +
        ' / <b>' + (it.defaultPriceWithoutVat ? Number(it.defaultPriceWithoutVat).toLocaleString('ru-RU') + ' ₽ без НДС' : '—') + '</b>' +
        (orgsWithPrices ? '<br>Индивидуальных цен: <b>' + orgsWithPrices + '</b>' : '') +
      '</div>' +
      (previewOrgs ? '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);">' + previewOrgs + '</div>' : '');

    const actions = document.createElement('div'); actions.className='item-actions';
    const edit = document.createElement('button');
    edit.className='card-btn primary'; edit.textContent='✏️ Изменить';
    edit.onclick = e => { e.stopPropagation(); editRefItem(kind, it); };
    const dup = document.createElement('button');
    dup.className='card-btn'; dup.textContent='＋';
    dup.title = 'Дублировать';
    dup.onclick = e => {
      e.stopPropagation();
      const c = clone(it); c.id = uid(); c.name = (it.name || '') + ' (копия)';
      c.createdAt = Date.now(); c.updatedAt = Date.now();
      arr.push(c); saveDB();
      renderRefsItems(area, kind);
      toast('Копия создана','info');
    };
    const del = document.createElement('button');
    del.className='card-btn danger'; del.textContent='🗑';
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm('Удалить «' + (it.name || 'без названия') + '»?')) return;
      const idx = arr.findIndex(x => x.id === it.id);
      if (idx >= 0) arr.splice(idx, 1);
      saveDB(); renderRefsItems(area, kind);
      toast('Удалено','info');
    };
    actions.append(edit, dup, del);
    card.appendChild(actions);
    card.onclick = () => editRefItem(kind, it);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  area.appendChild(wrap);
}

function calculateTireCircumference({ width, aspect, diameter }){
  const sidewall = width*aspect/100;
  const D = 2*sidewall + diameter*25.4;
  const C = Math.PI*D;
  return { sidewall, D, C, revolutionsPerKm: 1000000/C };
}

function calculateKW({ lastCalib, tacho, actual, currentK }){
  const Pt = tacho - lastCalib, Pa = actual - lastCalib, Diff = Math.abs(Pt - Pa);
  if (Diff === 0) return { error: 'Пробеги совпадают — корректировка не требуется', Pt, Pa, Diff };
  let K_new;
  if (Pa > Pt) K_new = currentK - ((100/(Pa/Diff))*(currentK/100));
  else         K_new = currentK + ((100/(Pa/Diff))*(currentK/100));
  return { Pt, Pa, Diff, K_new };
}

  const r = calculateKW(kwInputs);
  if (r.error){ toast('Ошибка: '+r.error,'error'); return; }
  const defaultName = `${tacho} → ${actual} км (K: ${fmtNumber(currentK,2)} → ${fmtNumber(r.K_new,2)})`;
  db.kwCalcs.push({
    id: uid(), name: kwInputs.name.trim()||defaultName,
    lastCalib, tacho, actual, currentK,
    Pt: r.Pt, Pa: r.Pa, diff: r.Diff, newK: r.K_new,
    createdAt: Date.now()
  });
  saveDB(); kwInputs.name=''; renderTools($('#sheetArea'));
  toast('Пересчёт K/W сохранён','success');
}

/* --- Утилиты --- */
function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function canvasToBlob(canvas, type, quality){
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), type, quality);
  });
}
function loadScript(url){
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + url + '"]')) { resolve(); return; }
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Не удалось загрузить ' + url));
    document.head.appendChild(s);
  });
}
function fmtBytes(n){
  if (n < 1024) return n + ' Б';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' КБ';
  return (n/1024/1024).toFixed(2) + ' МБ';
}
function stripExt(name){ return String(name).replace(/\.[^./\\]+$/, ''); }

/* ============================================================
   МОДАЛЬНЫЙ ПРОСМОТР С МАСШТАБИРОВАНИЕМ
   ============================================================ */
function openImagePreview(src, title){
  const ov = document.createElement('div');
  ov.className = 'preview-overlay';

  const modal = document.createElement('div');
  modal.className = 'preview-modal';

  /* --- Шапка --- */
  const header = document.createElement('div');
  header.className = 'preview-header';

  const titleEl = document.createElement('span');
  titleEl.className = 'preview-title';
  titleEl.textContent = title || 'Просмотр';
  header.appendChild(titleEl);

  const controls = document.createElement('div');
  controls.className = 'preview-controls';

  const btnOut = document.createElement('button');
  btnOut.type = 'button'; btnOut.textContent = '−'; btnOut.title = 'Уменьшить';
  const slider = document.createElement('input');
  slider.type = 'range'; slider.className = 'preview-zoom';
  slider.min = '10'; slider.max = '500'; slider.step = '5'; slider.value = '100';
  const valEl = document.createElement('span');
  valEl.className = 'preview-zoom-val'; valEl.textContent = '100%';
  const btnIn = document.createElement('button');
  btnIn.type = 'button'; btnIn.textContent = '+'; btnIn.title = 'Увеличить';
  const btnFit = document.createElement('button');
  btnFit.type = 'button'; btnFit.textContent = 'Вписать';
  const btnReset = document.createElement('button');
  btnReset.type = 'button'; btnReset.textContent = '100%';

  controls.append(btnOut, slider, valEl, btnIn, btnFit, btnReset);
  header.appendChild(controls);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'preview-close';
  closeBtn.textContent = '×';
  closeBtn.title = 'Закрыть (Esc)';
  closeBtn.onclick = () => close();
  header.appendChild(closeBtn);

  modal.appendChild(header);

  /* --- Область просмотра --- */
  const viewport = document.createElement('div');
  viewport.className = 'preview-viewport';
  const img = document.createElement('img');
  img.src = src;
  img.alt = title || '';
  img.draggable = false;
  viewport.appendChild(img);
  modal.appendChild(viewport);

  ov.appendChild(modal);
  document.body.appendChild(ov);

  /* --- Состояние --- */
  let zoom = 100;
  let panX = 0;
  let panY = 0;

  function applyTransform(){
    img.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + (zoom / 100) + ')';
  }
  function setZoom(z){
    zoom = Math.max(10, Math.min(500, z));
    slider.value = String(zoom);
    valEl.textContent = Math.round(zoom) + '%';
    applyTransform();
  }
  function fitToViewport(){
    const vw = viewport.clientWidth - 24;
    const vh = viewport.clientHeight - 24;
    const iw = img.naturalWidth || 1;
    const ih = img.naturalHeight || 1;
    const f = Math.min(vw / iw, vh / ih) * 100;
    zoom = Math.max(10, Math.min(500, f));
    panX = 0; panY = 0;
    slider.value = String(zoom);
    valEl.textContent = Math.round(zoom) + '%';
    applyTransform();
  }

  slider.addEventListener('input', () => setZoom(parseFloat(slider.value)));
  btnOut.onclick  = () => setZoom(zoom - 25);
  btnIn.onclick   = () => setZoom(zoom + 25);
  btnReset.onclick= () => { zoom = 100; panX = 0; panY = 0; slider.value='100'; valEl.textContent='100%'; applyTransform(); };
  btnFit.onclick  = fitToViewport;

  /* Колесо мыши — зум */
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY;
    setZoom(zoom + (delta > 0 ? -15 : 15));
  }, { passive: false });

  /* Двойной клик — сбросить/вписать */
  viewport.addEventListener('dblclick', () => { fitToViewport(); });

  /* Панорамирование мышью */
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  viewport.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = panX; oy = panY;
    e.preventDefault();
  });
  const onMove = e => {
    if (!dragging) return;
    panX = ox + (e.clientX - sx);
    panY = oy + (e.clientY - sy);
    applyTransform();
  };
  const onUp = () => { dragging = false; };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  /* Закрытие */
  function close(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('keydown', escHandler);
    ov.remove();
  }
  const escHandler = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', escHandler);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });

  /* Автоматически вписать при загрузке */
  if (img.complete) setTimeout(fitToViewport, 30);
  else img.addEventListener('load', () => setTimeout(fitToViewport, 30), { once: true });
}

/* --- Дроп-зона (переиспользуемая) --- */
function makeDropZone(accept, multiple, onFiles, fileList){
  const dz = document.createElement('div');
  dz.className = 'drop-zone';
  const multipleHint = multiple ? ' (можно несколько)' : '';
  dz.innerHTML =
    '<span class="big-icon">📁</span>' +
    '<b>Перетащите файл' + multipleHint + ' сюда</b>' +
    '<div class="hint-sm">или нажмите, чтобы выбрать. Форматы: ' + accept + '</div>';

  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  if (multiple) inp.multiple = true;
  inp.style.display = 'none';
  dz.appendChild(inp);

  dz.onclick = () => inp.click();
  inp.onchange = () => {
    if (inp.files.length) onFiles([...inp.files]);
    inp.value = '';
  };
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('dragover');
    const files = [...e.dataTransfer.files];
    if (files.length) onFiles(files);
  });
  return dz;
}

/* ============================================================
   РЕЖИМ 1: WebP → JPG / PNG
   ============================================================ */
async function convertWebpToImage(file, opts){
  const { format, quality, scaleToWidth, background } = opts;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (scaleToWidth && scaleToWidth > 0 && scaleToWidth < w){
          h = Math.round(h * scaleToWidth / w);
          w = scaleToWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        // Для JPG заливаем фон (JPG не поддерживает прозрачность)
        if (format !== 'png'){
          ctx.fillStyle = background || '#ffffff';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(img, 0, 0, w, h);
        const mime = format === 'png' ? 'image/png' : 'image/jpeg';
        const blob = await canvasToBlob(canvas, mime, quality || .92);
        URL.revokeObjectURL(url);
        resolve(blob);
      } catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать WebP')); };
    img.src = url;
  });
}

/* ============================================================
   РЕЖИМ 2: PDF → JPG (несколько страниц)
   ============================================================ */
async function convertPdfToImages(file, opts, onProgress){
  const { quality, scale, format } = opts;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const pdfjsLib = window.pdfjsLib;
  if (!pdfjsLib) throw new Error('pdf.js не загрузился (проверьте интернет)');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const blobs = [];
  const sc = Math.max(0.5, Math.min(4, scale || 2));

  for (let i = 1; i <= pdf.numPages; i++){
    if (onProgress) onProgress(i, pdf.numPages);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: sc });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    const mime = format === 'png' ? 'image/png' : 'image/jpeg';
    const blob = await canvasToBlob(canvas, mime, quality || .92);
    blobs.push({ blob, page: i });
  }
  return blobs;
}

/* ============================================================
   РЕЖИМ 3: JPG/PNG → PDF
   ============================================================ */
async function convertImagesToPdf(files, opts, onProgress){
  const { pageSize, orientation, quality } = opts;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const jsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDF) throw new Error('jsPDF не загрузился (проверьте интернет)');

  // Считываем все картинки
  const items = [];
  for (let i = 0; i < files.length; i++){
    if (onProgress) onProgress(i + 1, files.length);
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(files[i]);
    });
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = dataUrl;
    });
    items.push({
      dataUrl,
      isPng: files[i].type === 'image/png' || /\.png$/i.test(files[i].name),
      w: img.naturalWidth,
      h: img.naturalHeight
    });
  }

  let pdf = null;
  const A4_W = 210, A4_H = 297;

  items.forEach((it, i) => {
    let pw, ph;
    let orient = orientation || 'auto';

    if (pageSize === 'a4'){
      pw = A4_W; ph = A4_H;
      if (orient === 'auto') orient = it.w > it.h ? 'landscape' : 'portrait';
      if (orient === 'landscape'){ [pw, ph] = [A4_H, A4_W]; }
    } else {
      // Размер страницы = размер картинки в мм (при 96 dpi)
      pw = it.w * 25.4 / 96;
      ph = it.h * 25.4 / 96;
      if (orient === 'landscape'){ [pw, ph] = [ph, pw]; }
    }

    const pdfOrient = pw > ph ? 'landscape' : 'portrait';
    if (!pdf){
      pdf = new jsPDF({ unit: 'mm', format: [Math.min(pw,ph), Math.max(pw,ph)], orientation: pdfOrient });
    } else {
      pdf.addPage([Math.min(pw,ph), Math.max(pw,ph)], pdfOrient);
    }

    // Вписываем картинку с сохранением пропорций
    const srcW = it.w, srcH = it.h;
    const ratio = Math.min(pw / srcW, ph / srcH);
    const drawW = srcW * ratio;
    const drawH = srcH * ratio;
    const x = (pw - drawW) / 2;
    const y = (ph - drawH) / 2;
    pdf.addImage(it.dataUrl, it.isPng ? 'PNG' : 'JPEG', x, y, drawW, drawH, undefined, quality >= 0.95 ? 'NONE' : 'FAST');
  });

  return pdf.output('blob');
}

    '<h3>🖼 JPG / PNG → PDF <span class="formula-tag">Объединение в один PDF</span></h3>' +
